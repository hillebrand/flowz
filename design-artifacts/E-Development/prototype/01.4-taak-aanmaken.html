<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Taak aanmaken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=18"></script>
  <script src="shared/modal.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col font-karla">

  <header class="bg-white border-b border-gray-100 flex items-center px-4 py-3">
    <div class="w-12"></div>
    <span class="flex-1 flex justify-center"><span class="font-bold text-xl text-gray-900">Flowz</span></span>
    <div class="w-12"></div>
  </header>

  <main class="flex-1 px-6 py-6 max-w-sm mx-auto w-full overflow-y-auto">

    <!-- Voortgang wachtrij -->
    <p id="taak-aanmaken-voortgang-wachtrij-indicator"
       class="text-xs text-gray-400 text-center mb-6"></p>

    <!-- Section: Basisgegevens -->
    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Taaknaam</label>
        <input id="taak-aanmaken-basisgegevens-taaknaam-veld"
               type="text"
               class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Omschrijving <span class="text-gray-300 font-normal normal-case">(optioneel)</span></label>
        <textarea id="taak-aanmaken-basisgegevens-omschrijving-veld"
                  rows="2"
                  placeholder="Specifieke instructies, leerdoelen, ..."
                  class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary resize-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Deadline</label>
        <input id="taak-aanmaken-basisgegevens-deadline-input"
               type="date"
               class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>

      <!-- Recurring toggle -->
      <button type="button" onclick="toggleRecurring()"
              class="w-full flex items-center justify-between px-4 py-3 rounded-xl border transition-all"
              id="recurring-btn"
              data-active="false"
              style="border-color:#e5e7eb; background:white">
        <span class="flex items-center gap-2 text-sm font-medium text-gray-600">
          <span>↻</span> Herhalende taak
        </span>
        <span id="recurring-label"
              class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-400 font-medium">Uit</span>
      </button>

      <!-- Period selector (shown when recurring is on) -->
      <div id="recurring-period-panel" style="display:none" class="bg-indigo-50 rounded-xl px-4 py-3 space-y-3">
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide">Herhaling</label>
        <div class="flex flex-wrap gap-2" id="period-btns">
          <button type="button" onclick="setPeriod('daily')" data-period="daily"
                  class="period-btn px-3 py-1.5 rounded-lg border text-sm font-medium transition-all">Dagelijks</button>
          <button type="button" onclick="setPeriod('interval')" data-period="interval"
                  class="period-btn px-3 py-1.5 rounded-lg border text-sm font-medium transition-all">Om de X dagen</button>
          <button type="button" onclick="setPeriod('weekly')" data-period="weekly"
                  class="period-btn px-3 py-1.5 rounded-lg border text-sm font-medium transition-all">Wekelijks</button>
          <button type="button" onclick="setPeriod('weekdays')" data-period="weekdays"
                  class="period-btn px-3 py-1.5 rounded-lg border text-sm font-medium transition-all">Vaste dagen</button>
        </div>

        <!-- Interval stepper -->
        <div id="interval-row" style="display:none" class="flex items-center gap-3">
          <span class="text-sm text-gray-600">Elke</span>
          <button type="button" onclick="changeInterval(-1)"
                  class="w-8 h-8 rounded-full border border-gray-300 text-gray-600 flex items-center justify-center hover:border-primary hover:text-primary transition-colors text-lg leading-none">−</button>
          <span id="interval-display" class="text-lg font-semibold text-gray-900 w-5 text-center">2</span>
          <button type="button" onclick="changeInterval(1)"
                  class="w-8 h-8 rounded-full border border-gray-300 text-gray-600 flex items-center justify-center hover:border-primary hover:text-primary transition-colors text-lg leading-none">+</button>
          <span class="text-sm text-gray-600">dagen</span>
        </div>

        <!-- Weekly: shows which day -->
        <div id="weekly-row" style="display:none" class="text-sm text-gray-600">
          Iedere <span id="weekly-day-label" class="font-medium text-indigo-600"></span>
        </div>

        <!-- Weekdays checkboxes -->
        <div id="weekdays-row" style="display:none" class="flex flex-wrap gap-2">
          <!-- Ma Di Wo Do Vr Za Zo; JS days: 1 2 3 4 5 6 0 -->
        </div>
      </div>
      </button>
    </div>

    <!-- Section: Verrijking -->
    <div class="space-y-5 mb-6">
      <!-- Type -->
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Type</label>
        <div id="taak-aanmaken-verrijking-type-selector" class="flex flex-wrap gap-2">
          <button onclick="setTaskType('Huiswerk')" data-t="Huiswerk"
                  class="type-btn py-2 px-3 rounded-xl border text-sm font-medium transition-all border-primary bg-primary/10 text-primary">Huiswerk</button>
          <button onclick="setTaskType('Opdracht')" data-t="Opdracht"
                  class="type-btn py-2 px-3 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">Opdracht</button>
          <button onclick="setTaskType('Proefwerk')" data-t="Proefwerk"
                  class="type-btn py-2 px-3 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">Proefwerk</button>
          <button onclick="setTaskType('S.O.')" data-t="S.O."
                  class="type-btn py-2 px-3 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">S.O.</button>
          <button onclick="setTaskType('Mondeling')" data-t="Mondeling"
                  class="type-btn py-2 px-3 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">Mondeling</button>
        </div>
      </div>

      <!-- Sessions stepper -->
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Sessies nodig</label>
        <div class="flex items-center gap-4">
          <button onclick="changeSessions(-1)"
                  class="w-10 h-10 rounded-full border border-gray-300 text-gray-600 text-xl flex items-center justify-center hover:border-primary hover:text-primary transition-colors">−</button>
          <span id="taak-aanmaken-verrijking-sessies-stepper"
                class="text-2xl font-semibold text-gray-900 w-8 text-center">1</span>
          <button onclick="changeSessions(1)"
                  class="w-10 h-10 rounded-full border border-gray-300 text-gray-600 text-xl flex items-center justify-center hover:border-primary hover:text-primary transition-colors">+</button>
        </div>
      </div>

      <!-- Sessieduur -->
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Sessieduur <span class="normal-case font-normal text-gray-400">(optioneel)</span></label>
        <div class="flex items-center gap-3">
          <input id="taak-aanmaken-verrijking-sessieduur" type="number" min="5" max="180" step="5"
                 class="w-24 border border-gray-300 rounded-xl px-3 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
          <span class="text-sm text-gray-400">min</span>
        </div>
        <p id="sessieduur-hint" class="text-xs text-gray-300 mt-1"></p>
      </div>

      <!-- Complexity -->
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Complexiteit</label>
        <div id="taak-aanmaken-verrijking-complexiteit-selector" class="flex gap-2">
          <button onclick="setComplexity('low')" data-v="low"
                  class="complexity-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">Laag</button>
          <button onclick="setComplexity('medium')" data-v="medium"
                  class="complexity-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all border-primary bg-primary/10 text-primary">Gemiddeld</button>
          <button onclick="setComplexity('high')" data-v="high"
                  class="complexity-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">Hoog</button>
        </div>
      </div>

      <!-- Priority -->
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Prioriteit</label>
        <div id="taak-aanmaken-verrijking-prioriteit-selector" class="flex gap-2">
          <button onclick="setPriority('low')" data-p="low"
                  class="priority-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">🔵 Laag</button>
          <button onclick="setPriority('normal')" data-p="normal"
                  class="priority-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all border-primary bg-primary/10 text-primary">⚪ Normaal</button>
          <button onclick="setPriority('high')" data-p="high"
                  class="priority-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all border-gray-200 text-gray-500">🔴 Hoog</button>
        </div>
      </div>

      <!-- Subtasks -->
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Deeltaken <span class="normal-case font-normal text-gray-400">(optioneel)</span></label>
        <div id="subtask-list" class="space-y-2 mb-2"></div>
        <button id="taak-aanmaken-verrijking-subtaak-toevoegen"
                onclick="addSubtask()"
                class="text-sm text-primary hover:text-primary-dark flex items-center gap-1 transition-colors">
          + Deeltaak toevoegen…
        </button>
      </div>

      <!-- Materials -->
      <div>
        <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Benodigdheden <span class="normal-case font-normal text-gray-400">(optioneel)</span></label>
        <div id="material-list" class="flex flex-wrap gap-2 mb-2"></div>
        <button id="taak-aanmaken-verrijking-benodigdheden-toevoegen"
                onclick="addMaterial()"
                class="text-sm text-primary hover:text-primary-dark flex items-center gap-1 transition-colors">
          + Benodigdheid toevoegen…
        </button>
      </div>
    </div>

    <!-- Section: Acties -->
    <div class="space-y-3 pb-8">
      <button id="taak-aanmaken-acties-opslaan-knop"
              onclick="saveTask()"
              class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 px-6 rounded-2xl transition-all shadow-lg shadow-indigo-200">
        <span id="save-btn-label">Opslaan →</span>
      </button>
      <button onclick="cancelTask()"
              class="w-full text-sm text-red-400 hover:text-red-600 py-2 transition-colors">
        Annuleren
      </button>
    </div>

  </main>

  <script>
    let queue = [];
    let queueIndex = 0;
    let currentTaskId = null;
    let sessions = 1;
    let sessionDuration = null;
    let complexity = 'medium';
    let priority = 'normal';
    let taskType = 'Huiswerk';
    let recurring = false;
    let recurringType = 'daily';
    let recurringInterval = 2;
    let recurringWeekday = null;   // null = use today when saving
    let recurringWeekdays = [];    // array of JS day numbers for 'weekdays' type
    let subtasks = [];
    let materials = [];

    const DAY_NAMES_NL = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
    // Display order: Ma Di Wo Do Vr Za Zo → JS days: 1 2 3 4 5 6 0
    const WEEKDAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
    const WEEKDAY_LABELS = { 0:'Zo', 1:'Ma', 2:'Di', 3:'Wo', 4:'Do', 5:'Vr', 6:'Za' };

    (async function() {
      await FS.initData();
      const queueRaw = sessionStorage.getItem('enrichment_queue');
      if (!queueRaw) { window.location.href = '01.5-takenoverzicht.html'; return; }
      queue = JSON.parse(queueRaw);
      loadTask();
    })();

    function loadTask() {
      if (queueIndex >= queue.length) {
        FS.markSetupDone();

        // If any of the newly enriched tasks is due today or tomorrow, the cached
        // daily plan doesn't include them yet — invalidate it so the shortlist
        // rebuilds with these urgent tasks included.
        const data = FS.loadData();
        const today    = FS.getDayKey();
        const tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate() + 1);
        const tomorrow = FS.getDayKey(tomorrowDate);
        const hasUrgent = queue.some(id => {
          const t = data.tasks.find(t => t.id === id);
          return t && !t.recurring && (t.deadline === today || t.deadline === tomorrow);
        });
        if (hasUrgent) localStorage.removeItem('fs_daily_plan');

        // Go to shortlist if daily routine, otherwise overview
        window.location.href = FS.getTodayEnergy() ? '02.2-shortlist-vandaag.html' : '01.5-takenoverzicht.html';
        return;
      }
      currentTaskId = queue[queueIndex];
      const data = FS.loadData();
      const task = data.tasks.find(t => t.id === currentTaskId);
      if (!task) { queueIndex++; loadTask(); return; }

      // Reset state
      sessions = task.sessions_total || 1;
      sessionDuration = task.session_duration_min || null;
      complexity = task.complexity || 'medium';
      priority = task.priority || 'normal';
      taskType = task.type || 'Huiswerk';
      recurring = task.recurring || false;
      recurringType = task.recurring_type || 'daily';
      recurringInterval = task.recurring_interval || 2;
      recurringWeekday = task.recurring_weekday ?? null;
      recurringWeekdays = [...(task.recurring_weekdays || [])];
      subtasks = [...(task.subtasks || [])];
      materials = [...(task.materials || [])];

      // Fill form
      document.getElementById('taak-aanmaken-basisgegevens-taaknaam-veld').value = task.title;
      document.getElementById('taak-aanmaken-basisgegevens-omschrijving-veld').value = task.description || '';
      const deadlineInput = document.getElementById('taak-aanmaken-basisgegevens-deadline-input');
      deadlineInput.value = task.deadline || '';
      deadlineInput.min = new Date().toISOString().slice(0, 10);
      document.getElementById('taak-aanmaken-verrijking-sessies-stepper').textContent = sessions;
      const durInput = document.getElementById('taak-aanmaken-verrijking-sessieduur');
      const globalDur = data.settings?.session_length_min || 25;
      durInput.value = sessionDuration || '';
      durInput.placeholder = globalDur;
      document.getElementById('sessieduur-hint').textContent = `Standaard: ${globalDur} min`;
      durInput.onchange = () => { sessionDuration = durInput.value ? parseInt(durInput.value) : null; };
      updateComplexityUI();
      updatePriorityUI();
      updateTaskTypeUI();
      updateRecurringUI();
      renderSubtasks();
      renderMaterials();

      // Progress indicator
      const total = queue.length;
      const isLast = queueIndex === total - 1;
      document.getElementById('taak-aanmaken-voortgang-wachtrij-indicator').textContent =
        total > 1 ? `Taak ${queueIndex + 1} van ${total}` : '';
      document.getElementById('save-btn-label').textContent =
        (total > 1 && !isLast) ? 'Opslaan & volgende →' : 'Opslaan →';
    }

    function changeSessions(delta) {
      sessions = Math.max(1, Math.min(10, sessions + delta));
      document.getElementById('taak-aanmaken-verrijking-sessies-stepper').textContent = sessions;
    }

    function setComplexity(v) {
      complexity = v;
      updateComplexityUI();
    }

    function updateComplexityUI() {
      document.querySelectorAll('.complexity-btn').forEach(btn => {
        const active = btn.dataset.v === complexity;
        btn.className = 'complexity-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all ' +
          (active ? 'border-primary bg-primary/10 text-primary' : 'border-gray-200 text-gray-500');
      });
    }

    function setPriority(v) {
      priority = v;
      updatePriorityUI();
    }

    function updatePriorityUI() {
      document.querySelectorAll('.priority-btn').forEach(btn => {
        const active = btn.dataset.p === priority;
        btn.className = 'priority-btn flex-1 py-2.5 rounded-xl border text-sm font-medium transition-all ' +
          (active ? 'border-primary bg-primary/10 text-primary' : 'border-gray-200 text-gray-500');
      });
    }

    function setTaskType(v) {
      taskType = v;
      updateTaskTypeUI();
    }

    function updateTaskTypeUI() {
      document.querySelectorAll('.type-btn').forEach(btn => {
        const active = btn.dataset.t === taskType;
        btn.className = 'type-btn py-2 px-3 rounded-xl border text-sm font-medium transition-all ' +
          (active ? 'border-primary bg-primary/10 text-primary' : 'border-gray-200 text-gray-500');
      });
    }

    function toggleRecurring() {
      recurring = !recurring;
      updateRecurringUI();
    }

    function updateRecurringUI() {
      const btn = document.getElementById('recurring-btn');
      const label = document.getElementById('recurring-label');
      const deadlineRow = document.getElementById('taak-aanmaken-basisgegevens-deadline-input').closest('div');
      const panel = document.getElementById('recurring-period-panel');
      if (recurring) {
        btn.style.borderColor = '#6366f1';
        btn.style.background = '#eef2ff';
        label.textContent = 'Aan';
        label.className = 'text-xs px-2 py-0.5 rounded-full bg-primary/10 text-primary font-medium';
        deadlineRow.style.opacity = '0.3';
        deadlineRow.style.pointerEvents = 'none';
        panel.style.display = '';
        updatePeriodUI();
      } else {
        btn.style.borderColor = '#e5e7eb';
        btn.style.background = 'white';
        label.textContent = 'Uit';
        label.className = 'text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-400 font-medium';
        deadlineRow.style.opacity = '';
        deadlineRow.style.pointerEvents = '';
        panel.style.display = 'none';
      }
    }

    function setPeriod(type) {
      recurringType = type;
      updatePeriodUI();
    }

    function changeInterval(delta) {
      recurringInterval = Math.max(2, Math.min(30, recurringInterval + delta));
      document.getElementById('interval-display').textContent = recurringInterval;
    }

    function toggleWeekday(day) {
      const i = recurringWeekdays.indexOf(day);
      if (i >= 0) recurringWeekdays.splice(i, 1);
      else recurringWeekdays.push(day);
      updatePeriodUI();
    }

    function updatePeriodUI() {
      // Highlight active period button
      document.querySelectorAll('.period-btn').forEach(btn => {
        const active = btn.dataset.period === recurringType;
        btn.className = 'period-btn px-3 py-1.5 rounded-lg border text-sm font-medium transition-all ' +
          (active ? 'border-primary bg-primary text-white' : 'border-gray-300 bg-white text-gray-600');
      });

      const intervalRow  = document.getElementById('interval-row');
      const weeklyRow    = document.getElementById('weekly-row');
      const weekdaysRow  = document.getElementById('weekdays-row');

      intervalRow.style.display  = recurringType === 'interval'  ? '' : 'none';
      weeklyRow.style.display    = recurringType === 'weekly'    ? '' : 'none';
      weekdaysRow.style.display  = recurringType === 'weekdays'  ? '' : 'none';

      if (recurringType === 'interval') {
        document.getElementById('interval-display').textContent = recurringInterval;
      }

      if (recurringType === 'weekly') {
        const day = recurringWeekday ?? new Date().getDay();
        document.getElementById('weekly-day-label').textContent = DAY_NAMES_NL[day];
      }

      if (recurringType === 'weekdays') {
        weekdaysRow.innerHTML = WEEKDAY_ORDER.map(d => {
          const active = recurringWeekdays.includes(d);
          return `<button type="button" onclick="toggleWeekday(${d})"
            class="px-3 py-1.5 rounded-lg border text-sm font-medium transition-all ${active ? 'border-primary bg-primary text-white' : 'border-gray-300 bg-white text-gray-600'}"
            >${WEEKDAY_LABELS[d]}</button>`;
        }).join('');
      }
    }

    async function addSubtask() {
      const title = await FS_Modal.showInput('Deeltaaknaam:', { placeholder: 'bijv. Bronnen zoeken' });
      if (!title) return;
      subtasks.push({ id: 'sub_' + Date.now(), title, done: false });
      renderSubtasks();
    }

    function renderSubtasks() {
      document.getElementById('subtask-list').innerHTML = subtasks.map((s, i) => `
        <div class="flex items-center gap-2 text-sm text-gray-700">
          <span class="text-gray-400">•</span>
          <span class="flex-1">${s.title}</span>
          <button onclick="removeSubtask(${i})" class="text-gray-300 hover:text-red-400 text-xs">✕</button>
        </div>
      `).join('');
    }

    function removeSubtask(i) { subtasks.splice(i, 1); renderSubtasks(); }

    async function addMaterial() {
      const m = await FS_Modal.showInput('Benodigdheid toevoegen:', { placeholder: 'bijv. leerboek, rekenmachine' });
      if (!m) return;
      materials.push(m);
      renderMaterials();
    }

    function renderMaterials() {
      document.getElementById('material-list').innerHTML = materials.map((m, i) => `
        <span class="inline-flex items-center gap-1 bg-gray-100 text-gray-600 text-xs px-3 py-1.5 rounded-full">
          ${m}
          <button onclick="removeMaterial(${i})" class="text-gray-400 hover:text-red-400 ml-1">✕</button>
        </span>
      `).join('');
    }

    function removeMaterial(i) { materials.splice(i, 1); renderMaterials(); }

    function saveTask() {
      const data = FS.loadData();
      const task = data.tasks.find(t => t.id === currentTaskId);
      if (task) {
        task.title = document.getElementById('taak-aanmaken-basisgegevens-taaknaam-veld').value.trim() || task.title;
        task.description = document.getElementById('taak-aanmaken-basisgegevens-omschrijving-veld').value.trim();
        if (!recurring) {
          task.deadline = document.getElementById('taak-aanmaken-basisgegevens-deadline-input').value || task.deadline;
          delete task.recurring;
          delete task.recurring_type;
          delete task.recurring_interval;
          delete task.recurring_weekday;
          delete task.recurring_weekdays;
        } else {
          task.deadline = null;
          task.recurring = true;
          task.recurring_type = recurringType;
          task.recurring_interval = recurringType === 'interval' ? recurringInterval : undefined;
          task.recurring_weekday  = recurringType === 'weekly'   ? (recurringWeekday ?? new Date().getDay()) : undefined;
          task.recurring_weekdays = recurringType === 'weekdays' ? [...recurringWeekdays] : undefined;
        }
        task.sessions_total = sessions;
        task.session_duration_min = sessionDuration || null;
        task.complexity = complexity;
        task.priority = priority;
        task.type = taskType === 'Huiswerk' ? null : taskType;
        task.subtasks = subtasks;
        task.materials = materials;
        task.needs_enrichment = false;
        FS.saveData(data);
      }
      queueIndex++;
      loadTask();
    }

    function cancelTask() {
      // Clear the enrichment queue entirely — skip all remaining tasks
      sessionStorage.removeItem('enrichment_queue');
      // Clean up tasks that are still empty (e.g. created via FAB, never given a title)
      const data = FS.loadData();
      const emptyIds = queue.slice(queueIndex).filter(id => {
        const t = data.tasks.find(t => t.id === id);
        return t && !t.title.trim() && t.needs_enrichment;
      });
      if (emptyIds.length > 0) {
        data.tasks = data.tasks.filter(t => !emptyIds.includes(t.id));
        FS.saveData(data);
      }

      // Invalidate today's plan if any already-enriched task is due today or tomorrow
      const today    = FS.getDayKey();
      const tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      const tomorrow = FS.getDayKey(tomorrowDate);
      const enrichedSoFar = queue.slice(0, queueIndex);
      const hasUrgent = enrichedSoFar.some(id => {
        const t = data.tasks.find(t => t.id === id);
        return t && !t.recurring && (t.deadline === today || t.deadline === tomorrow);
      });
      if (hasUrgent) localStorage.removeItem('fs_daily_plan');
      window.location.href = FS.getTodayEnergy() ? '02.2-shortlist-vandaag.html' : '01.5-takenoverzicht.html';
    }
  </script>
</body>
</html>
