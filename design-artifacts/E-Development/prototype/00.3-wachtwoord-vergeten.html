<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Wachtwoord vergeten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-white min-h-screen flex flex-col font-karla">

  <header class="flex items-center px-4 py-4 border-b border-gray-100">
    <a href="00.1-login.html" class="text-gray-500 hover:text-gray-800 text-sm font-medium flex items-center gap-1">← Terug</a>
    <span class="flex-1 flex justify-center"><span class="font-bold text-xl text-gray-900">Flowz</span></span>
    <div class="w-12"></div>
  </header>

  <main class="flex-1 flex flex-col justify-center px-6 py-10 max-w-sm mx-auto w-full">

    <div class="text-center mb-8">
      <div class="text-4xl mb-3">🔑</div>
      <h1 class="text-2xl font-bold text-gray-900">Wachtwoord vergeten</h1>
      <p class="text-sm text-gray-400 mt-1">Voer je e-mailadres in en we sturen je een link.</p>
    </div>

    <!-- Step 1: email form -->
    <div id="step-form">
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">E-mailadres</label>
          <input id="email"
                 type="email" autocomplete="email" required
                 placeholder="naam@voorbeeld.nl"
                 class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
        </div>

        <div id="error-msg" class="hidden text-sm text-red-500 bg-red-50 px-4 py-3 rounded-2xl"></div>

        <button type="button" id="submit-btn" onclick="handleSubmit()"
                class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-2xl shadow-sm shadow-indigo-200 transition-all active:scale-98 mt-2">
          Stuur resetlink →
        </button>
      </div>
    </div>

    <!-- Step 2: success / reset link (shown after submit) -->
    <div id="step-success" class="hidden text-center space-y-5">
      <div class="text-4xl">📬</div>
      <p class="text-gray-700 text-sm">Als dit e-mailadres bij ons bekend is, ontvang je een resetlink.</p>
      <!-- Prototype: show the reset link directly since there is no email service yet -->
      <div id="reset-link-box" class="hidden bg-indigo-50 border border-indigo-200 rounded-2xl px-5 py-4 text-left space-y-2">
        <p class="text-xs font-bold text-indigo-400 uppercase tracking-wide">Prototype — resetlink</p>
        <p class="text-xs text-gray-500">In productie wordt deze link per e-mail verstuurd. Voor nu:</p>
        <a id="reset-link-anchor"
           href="#"
           class="block text-sm font-medium text-primary hover:underline break-all"></a>
      </div>
      <a href="00.1-login.html" class="block text-sm text-gray-400 hover:text-primary transition-colors">← Terug naar inloggen</a>
    </div>

  </main>

  <script>
    const WORKER_URL = 'https://flowstate-proxy.flowstate-evelien.workers.dev';

    async function handleSubmit() {
      const email = document.getElementById('email').value.trim();
      const btn   = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');

      if (!email) { showError('Vul je e-mailadres in'); return; }

      btn.disabled = true;
      btn.textContent = 'Bezig…';
      errEl.classList.add('hidden');

      try {
        const r    = await fetch(`${WORKER_URL}/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const body = await r.json();
        if (!r.ok) { showError(body.error || 'Er ging iets mis'); return; }

        document.getElementById('step-form').classList.add('hidden');
        document.getElementById('step-success').classList.remove('hidden');

        if (body._reset_token) {
          const link = `${location.origin}${location.pathname.replace('00.3-wachtwoord-vergeten.html', '')}00.4-wachtwoord-resetten.html?token=${body._reset_token}`;
          const anchor = document.getElementById('reset-link-anchor');
          anchor.textContent = link;
          anchor.href = link;
          document.getElementById('reset-link-box').classList.remove('hidden');
        }
      } catch {
        showError('Geen verbinding. Probeer het opnieuw.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Stuur resetlink →';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>
