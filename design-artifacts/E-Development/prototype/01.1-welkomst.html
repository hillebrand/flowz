<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Welkom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=21"></script>
</head>
<body class="bg-white min-h-screen flex flex-col font-karla">

  <main class="flex-1 flex flex-col items-center justify-center px-8 py-16 text-center">

    <div class="mb-8">
      <span class="font-bold text-4xl text-gray-900">Flowz</span>
    </div>

    <p class="text-lg font-normal text-gray-500 mb-6 max-w-xs leading-relaxed">
      Jouw studieplanner die met je meedenkt
    </p>

    <p class="text-sm text-gray-400 mb-12 max-w-xs leading-relaxed">
      Voeg je taken en deadlines toe, dan helpt Flowz je om je studietijd slim in te delen —
      met pauzes, energiechecks en overzicht.
    </p>

    <div class="w-full max-w-xs">
      <button onclick="start()"
              class="w-full bg-primary hover:bg-primary-dark active:scale-95 text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-150 shadow-lg shadow-indigo-200">
        Aan de slag →
      </button>
    </div>

  </main>

  <script>
    (async function() {
      await FS.initData();
      if (FS.isSetupDone()) {
        window.location.href = 'index.html';
      }
    })();

    function start() {
      FS.markSetupDone();
      window.location.href = '01.5-takenoverzicht.html';
    }
  </script>

</body>
</html>
