<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — Welkom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            'primary-dark': '#4f46e5',
          }
        }
      }
    }
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">

  <!-- Full-screen welcome layout -->
  <main class="flex-1 flex flex-col items-center justify-center px-8 py-16 text-center">

    <!-- Section: Welkomst -->
    <div id="welkomst-eerste-start-welkomst-app-logo"
         class="text-6xl mb-4 select-none" aria-hidden="true">✦</div>

    <h1 id="welkomst-eerste-start-welkomst-app-naam"
        class="text-4xl font-bold text-gray-900 mb-4 tracking-tight">
      FlowState
    </h1>

    <h2 id="welkomst-eerste-start-welkomst-tagline"
        class="text-lg font-normal text-gray-500 mb-16 max-w-xs leading-relaxed">
      Jouw studieplanners die met je meedenkt
    </h2>

    <!-- Section: Acties -->
    <div class="w-full max-w-xs space-y-4">

      <button id="welkomst-eerste-start-acties-handmatig-knop"
              onclick="skipMagister()"
              class="w-full bg-primary hover:bg-primary-dark active:scale-95 text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-150 shadow-lg shadow-indigo-200">
        Aan de slag →
      </button>

      <button onclick="connectMagister()"
              class="w-full bg-gray-100 hover:bg-gray-200 active:scale-95 text-gray-500 font-medium py-3 px-6 rounded-2xl transition-all duration-150 flex items-center justify-center gap-2 text-sm">
        <span id="btn-label">Magister koppelen (optioneel)</span>
        <span id="btn-spinner" class="hidden animate-spin">⟳</span>
      </button>

    </div>
  </main>

  <script>
    // Skip if already set up
    (async function() {
      await FS.initData();
      if (FS.isSetupDone()) {
        window.location.href = 'index.html';
      }
    })();

    function connectMagister() {
      const label = document.getElementById('btn-label');
      const spinner = document.getElementById('btn-spinner');
      label.textContent = 'Verbinden…';
      spinner.classList.remove('hidden');
      setTimeout(() => {
        window.location.href = '01.2-magister-sync.html';
      }, 600);
    }

    function skipMagister() {
      FS.markSetupDone();
      window.location.href = '01.5-takenoverzicht.html';
    }
  </script>

</body>
</html>
