<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Afgeronde taken</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=20"></script>
  <script src="shared/modal.js"></script>
  <script src="shared/nav.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-karla">

  <!-- App Header -->
  <header class="bg-white border-b border-gray-100 flex items-center px-4 py-3 sticky top-0 z-30">
    <button onclick="openNav()" class="text-gray-700 hover:opacity-70 w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-opacity"><svg viewBox="0 0 30 22" fill="none" class="w-6 h-5"><rect y="0" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="9.1" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="18.4" width="30" height="2.6" rx="1.3" fill="currentColor"/></svg></button>
    <span class="flex-1 flex justify-center"><span class="font-bold text-xl text-gray-900">Flowz</span></span>
    <a href="04.1-instellingen.html" class="text-gray-700 hover:opacity-70 w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-opacity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></a>
  </header>

  <main class="flex-1 px-4 py-4 max-w-sm mx-auto w-full pb-24">

    <div class="flex items-center gap-2 mb-5 px-1">
      <span class="text-xs font-bold tracking-widest text-gray-400">✓ AFGERONDE TAKEN</span>
      <div class="flex-1 h-px bg-gray-100"></div>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16">
      <div class="text-4xl mb-3">🏆</div>
      <p class="text-gray-500 text-sm">Nog geen afgeronde taken.<br>Ga aan de slag!</p>
    </div>

    <!-- Task list -->
    <div id="done-list" class="space-y-2"></div>

  </main>

  <script>
    injectNav('done');

    (async function() {
      await FS.initData();
      render();
    })();

    function render() {
      const data = FS.loadData();
      const done = data.tasks.filter(t => t.status === 'done');

      if (done.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('done-list').classList.add('hidden');
        return;
      }

      // Sort: most recently completed first (use deadline as proxy)
      done.sort((a, b) => (b.deadline || '') > (a.deadline || '') ? 1 : -1);

      document.getElementById('done-list').innerHTML = done.map(t => `
        <div class="flex items-center gap-3 bg-white rounded-2xl px-4 py-4 shadow-sm border border-gray-100 opacity-70">
          <div class="w-6 h-6 rounded-full bg-green-100 text-green-500 flex items-center justify-center flex-shrink-0 text-xs font-bold">✓</div>
          <div class="flex-1 min-w-0">
            <a href="03.1-taak-detail.html?id=${t.id}" class="text-sm font-medium text-gray-700 line-through truncate block">${t.title}</a>
            <div class="text-xs text-gray-400 mt-0.5">ingeleverd ${FS.formatDeadline(t.deadline)}</div>
          </div>
          <button onclick="reopenTask('${t.id}')"
                  class="text-xs text-primary hover:text-primary-dark font-medium transition-colors flex-shrink-0">
            Heropenen
          </button>
        </div>
      `).join('');
    }

    async function reopenTask(id) {
      const data = FS.loadData();
      const task = data.tasks.find(t => t.id === id);
      if (!task) return;

      const confirmed = await FS_Modal.showConfirm(
        `"${task.title}" heropenen?`,
        { confirmLabel: 'Heropenen', cancelLabel: 'Annuleren' }
      );
      if (!confirmed) return;

      task.status = 'pending';
      FS.saveData(data);
      render();
    }
  </script>
</body>
</html>
