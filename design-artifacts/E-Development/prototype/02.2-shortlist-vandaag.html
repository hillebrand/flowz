<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Vandaag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=19"></script>
  <script src="shared/modal.js"></script>
  <script src="shared/nav.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-karla">

  <!-- App Header -->
  <header class="bg-white border-b border-gray-100 flex items-center px-4 py-3 sticky top-0 z-30">
    <button onclick="openNav()" class="text-gray-700 hover:opacity-70 w-10 h-10 flex items-center justify-center rounded-xl transition-opacity">
      <svg viewBox="0 0 30 22" fill="none" class="w-6 h-5"><rect y="0" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="9.1" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="18.4" width="30" height="2.6" rx="1.3" fill="currentColor"/></svg>
    </button>
    <span class="flex-1 flex justify-center"><span class="font-bold text-xl text-gray-900">Flowz</span></span>
    <a href="04.1-instellingen.html" class="text-gray-700 hover:opacity-70 w-10 h-10 flex items-center justify-center rounded-xl transition-opacity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </a>
  </header>

  <!-- Section: Dagstatus — verwijderd, check-in zichtbaar via plan-subheader -->

  <main class="flex-1 px-4 py-4 max-w-sm mx-auto w-full pb-24">


    <!-- Vrije dag state -->
    <div id="blocked-state" class="hidden text-center py-16">
      <div class="text-4xl mb-3">🛋️</div>
      <p class="text-xl font-bold text-gray-900 mb-2">Vrije dag!</p>
      <p class="text-sm text-gray-400">Vandaag staat geblokkeerd.<br>Geniet van je rust.</p>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16">
      <div class="text-4xl mb-3">🌟</div>
      <p class="text-gray-500 text-sm">Niets te doen —<br>geniet van je vrije tijd!</p>
    </div>

    <!-- Done state -->
    <div id="done-state" class="hidden text-center py-16">
      <div class="text-5xl mb-4">🎉</div>
      <p class="text-xl font-bold text-gray-900 mb-2">Je bent klaar voor vandaag!</p>
      <p class="text-sm text-gray-400">Nice. Tot morgen!</p>
    </div>

    <!-- Motivation banner (1 remaining / all done) -->
    <div id="motivation-banner" class="hidden mb-3 rounded-xl px-4 py-3 text-sm font-medium text-center"></div>

    <!-- Time warning banner -->
    <div id="time-warning" class="hidden mb-3 rounded-xl px-4 py-3 bg-amber-50 border border-amber-200">
      <div class="flex items-start gap-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-amber-500 flex-shrink-0 mt-0.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <p id="time-warning-text" class="text-xs font-medium text-amber-800 leading-snug"></p>
      </div>
    </div>

    <!-- Sectieheader verplichte sessies -->
    <div id="plan-header" class="hidden flex items-center justify-between mb-3 px-1">
      <span id="plan-header-label" class="text-xs font-bold tracking-widest text-gray-400"></span>
      <span id="checkin-status" class="text-xs text-gray-400 cursor-pointer hover:text-gray-600 transition-colors"></span>
    </div>

    <!-- Verplichte sessies -->
    <div id="shortlist-container" class="space-y-3"></div>

    <!-- Optionele sessie -->
    <div id="optional-section" class="hidden mt-5">
      <div class="flex items-center gap-2 mb-3 px-1">
        <span class="text-xs font-bold tracking-widest text-gray-300">OPTIONEEL</span>
        <div class="flex-1 h-px bg-gray-100"></div>
      </div>
      <div id="optional-container"></div>
    </div>

    <!-- Add task -->
    <button onclick="goAddTask()"
            class="mt-4 w-full text-sm text-gray-400 hover:text-primary transition-colors py-3">
      + Taak toevoegen
    </button>

  </main>

  <script>
    injectNav('checkin');

    const ENERGY_CONFIG = {
      low:    { label: 'Laag',    badgeClass: 'bg-blue-100 text-blue-600' },
      normal: { label: 'Normaal', badgeClass: 'bg-green-100 text-green-600' },
      high:   { label: 'Hoog',    badgeClass: 'bg-yellow-100 text-yellow-700' },
    };
    const TIME_CONFIG = {
      low:    { label: 'Weinig tijd',  badgeClass: 'bg-orange-100 text-orange-600' },
      normal: { label: 'Normaal',      badgeClass: 'bg-gray-100 text-gray-600' },
      high:   { label: 'Veel tijd',    badgeClass: 'bg-purple-100 text-purple-600' },
    };

    let _data = null;
    let _plan = null;
    let _pressuredIds = new Set();
    let _confettiFired = false;

    (async function() {
      _data = await FS.initData();

      // Redirect to check-in if no energy/time set today
      const checkin = FS.getTodayCheckin();
      if (!checkin?.energy || !checkin?.time) { window.location.href = '02.1-energie-check-in.html'; return; }
      const energy = checkin.energy;
      const time   = checkin.time;

      // Day header
      const now = new Date();
      // badges
      const tc = TIME_CONFIG[time] || TIME_CONFIG.normal;
      const ec = ENERGY_CONFIG[energy] || ENERGY_CONFIG.normal;
      const statusEl = document.getElementById('checkin-status');
      const _clock = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 inline-block mr-0.5 -mt-px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;
      const _bolt  = `<svg viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5 inline-block mr-0.5 -mt-px"><path d="M13 2L4 14h7l-1 8 10-12h-7l1-8z"/></svg>`;
      statusEl.innerHTML = `${_clock}${tc.label}&ensp;·&ensp;${_bolt}${ec.label}`;

      // IDs of tasks with capacity pressure (for orange card highlight)
      _pressuredIds = new Set(FS.getCapacityPressuredTaskIds(_data.tasks, _data.settings || {}));

      // Load today's plan from cache, but always re-verify availability against
      // current settings — recurring blocks may have changed since the plan was cached.
      const _currentlyAvailable = FS.isTodayAvailable(_data.settings || {});
      _plan = FS.loadTodayPlan(_data.tasks)
           || FS.buildDailyPlan(_data.tasks, _data.settings || {}, energy, time);
      if (_plan.todayAvailable !== _currentlyAvailable) {
        _plan = FS.buildDailyPlan(_data.tasks, _data.settings || {}, energy, time);
      }
      FS.saveTodayPlan(_plan);

      // Persist planned count for the week-overview bars on the progress page.
      // Use the union of plan IDs + tasks already done today so the count is
      // correct even when buildDailyPlan ran after some tasks were marked done.
      if (!_data.daily_plans) _data.daily_plans = {};
      const _todayKey = FS.getDayKey();
      const _doneToday = new Set((_data.sessions_log || []).filter(s => s.date === _todayKey).map(s => s.task_id));
      const _planIds   = new Set(_plan.required.map(t => t.id));
      _data.daily_plans[_todayKey] = new Set([..._planIds, ..._doneToday]).size;
      FS.saveData(_data);

      if (!_plan.todayAvailable) {
        document.getElementById('blocked-state').classList.remove('hidden');
        return;
      }

      if (_plan.required.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }

      // Show time warning when forced tasks exceed the chosen time budget
      if (_plan.timeOverBudget) {
        const budgetLabel = { low: 'een uur', normal: '2,5 uur' }[checkin.time] || `${_plan.timeBudget} minuten`;
        document.getElementById('time-warning-text').textContent =
          `Je huiswerk vraagt vandaag meer tijd dan je beschikbaar hebt. Je hebt aangegeven ${budgetLabel} te hebben, maar het huiswerk kost nog zo'n ${Math.round(_plan.minutesPlanned / 60 * 10) / 10} uur. Plan extra tijd in!`;
        document.getElementById('time-warning').classList.remove('hidden');
      }

      // Urgency banner removed — colour-coded card borders communicate this

      renderPage();
    })();

    function renderPage() {
      _data = FS.loadData();
      renderRequired();
      renderOptional();
      checkAllDone();
    }

    function renderRequired() {
      const header = document.getElementById('plan-header');
      const label  = document.getElementById('plan-header-label');
      const n      = _plan.required.length;
      const done   = _plan.required.filter(t => FS.hasSessionToday(t.id, _data.sessions_log)).length;
      const _days   = ['ZONDAG','MAANDAG','DINSDAG','WOENSDAG','DONDERDAG','VRIJDAG','ZATERDAG'];
      const _months = ['JANUARI','FEBRUARI','MAART','APRIL','MEI','JUNI','JULI','AUGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DECEMBER'];
      const _now    = new Date();
      const _dateStr = `${_days[_now.getDay()]} ${_now.getDate()} ${_months[_now.getMonth()]}`;
      header.classList.remove('hidden');
      label.textContent = `${_dateStr} — ${done}/${n} SESSIE${n !== 1 ? 'S' : ''}`;

      document.getElementById('shortlist-container').innerHTML =
        _plan.required.map(t => taskCard(t, false)).join('');
    }

    function renderOptional() {
      const section   = document.getElementById('optional-section');
      const container = document.getElementById('optional-container');
      const allDone   = _plan.required.every(t => FS.hasSessionToday(t.id, _data.sessions_log));
      if (!_plan.optional || allDone) { section.classList.add('hidden'); return; }
      section.classList.remove('hidden');
      container.innerHTML = taskCard(_plan.optional, true);
    }

    function taskCard(t, isOptional) {
      const todayDone = FS.hasSessionToday(t.id, _data.sessions_log);
      const task      = _data.tasks.find(d => d.id === t.id) || t;
      const isRecurring = !!task.recurring;
      const remaining = Math.max(0, task.sessions_total - task.sessions_done);
      const urgency   = isRecurring ? 'upcoming' : FS.getUrgency(t.deadline, Math.max(1, remaining));

      // Figma: witte kaart met dikke gekleurde linker rand
      let leftBorderColor, titleColor;
      if (isOptional) {
        leftBorderColor = '#B1DAFF';
        titleColor = 'text-gray-500';
      } else if (todayDone) {
        leftBorderColor = '#BEBEBE';
        titleColor = 'text-gray-400 line-through';
      } else if (urgency === 'urgent') {
        leftBorderColor = '#FFB1B1';
        titleColor = 'text-[#A30000] font-semibold';
      } else if (_pressuredIds.has(t.id)) {
        leftBorderColor = '#FFD8A8';
        titleColor = 'text-amber-800 font-medium';
      } else {
        leftBorderColor = '#B1DAFF';
        titleColor = 'text-gray-900 font-medium';
      }

      const daysUntilDeadline = t.deadline
        ? Math.ceil((new Date(t.deadline + 'T00:00:00') - (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })()) / 86400000)
        : null;
      const deadlineBadge = daysUntilDeadline === 1 && !isOptional && !todayDone
        ? `<span class="text-xs font-medium text-[#FF7D7D]">deadline morgen!</span>`
        : '';

      const subline = isRecurring
        ? `<span class="text-xs font-medium text-indigo-400">${FS.getRecurringLabel(t)}</span>`
        : `<span class="text-xs text-gray-400">${FS.formatDeadline(t.deadline)} · nog ${remaining} sessie${remaining !== 1 ? 's' : ''}</span>`;

      const typeBadge = FS.taskTypeBadge(task.type);

      return `
        <div id="card-${t.id}"
             class="bg-white rounded-2xl shadow-sm flex items-stretch transition-all duration-300 overflow-hidden ${todayDone ? 'opacity-50' : ''}">
          <div class="w-1.5 flex-shrink-0 rounded-l-2xl" style="background:${leftBorderColor}"></div>
          <div class="flex-1 px-3 py-3 flex items-start gap-3">
            <button onclick="toggleSession('${t.id}')"
                    class="mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-all
                      ${todayDone ? 'bg-gray-800 border-gray-800 text-white text-xs' : 'border-gray-300'}"
                    style="${!todayDone ? 'border-color:' + leftBorderColor : ''}">
              ${todayDone ? '✓' : ''}
            </button>
            <a href="03.1-taak-detail.html?id=${t.id}" class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <div class="text-sm ${titleColor}">${t.title}</div>
                ${typeBadge}
              </div>
              <div class="mt-1 flex items-center gap-2 flex-wrap">
                ${deadlineBadge}
                ${subline}
              </div>
            </a>
          </div>
        </div>`;
    }

    function checkAllDone() {
      const required  = _plan.required;
      if (required.length === 0) return;
      const doneCnt   = required.filter(t => FS.hasSessionToday(t.id, _data.sessions_log)).length;
      const remaining = required.length - doneCnt;
      const banner    = document.getElementById('motivation-banner');
      const todayStr  = FS.getDayKey();

      if (remaining === 0) {
        // All done — record in completed_days for streak
        if (!_data.completed_days) _data.completed_days = [];
        if (!_data.completed_days.includes(todayStr)) {
          _data.completed_days.push(todayStr);
          FS.saveData(_data);
        }
        banner.className = 'mb-3 rounded-xl px-4 py-4 text-center bg-green-50 border border-green-200';
        banner.innerHTML = '<div class="text-2xl mb-1">🎉</div><div class="font-bold text-green-800 text-base">Hoera! Je bent klaar voor vandaag!</div><div class="text-sm text-green-600 mt-0.5 mb-3">Nice — geniet van je vrije tijd!</div><button onclick="goAddTask()" class="text-sm font-medium text-green-700 border border-green-300 rounded-xl px-4 py-2 hover:bg-green-100 transition-colors">+ Extra taak toevoegen</button>';
        banner.classList.remove('hidden');
        if (!_confettiFired) {
          _confettiFired = true;
          setTimeout(() => FS.showConfetti(), 300);
        }
      } else {
        // Not all done — remove today from completed_days if it was there
        if (_data.completed_days?.includes(todayStr)) {
          _data.completed_days = _data.completed_days.filter(d => d !== todayStr);
          FS.saveData(_data);
        }
        if (remaining === 1) {
          banner.className = 'mb-3 rounded-xl px-4 py-3 text-sm font-medium text-center bg-indigo-50 border border-indigo-100 text-indigo-700';
          banner.textContent = '💪 Nog maar 1 taak te gaan!';
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
        }
        _confettiFired = false;
      }
    }

    function toggleSession(id) {
      _data = FS.loadData();
      const task = _data.tasks.find(t => t.id === id);
      if (!task) return;

      const todayStr = FS.getDayKey();
      _data.sessions_log = _data.sessions_log || [];

      const realIdx = _data.sessions_log.map((s, i) => ({ s, i }))
        .filter(({ s }) => s.task_id === id && s.date === todayStr)
        .map(({ i }) => i)
        .pop();

      if (realIdx === undefined) {
        // Log session — use centralized helper (handles recurring last_completed too)
        FS.applySessionDone(task);
        _data.sessions_log.push({ task_id: id, date: todayStr });
        if (!_data.study_days) _data.study_days = [];
        if (!_data.study_days.includes(todayStr)) _data.study_days.push(todayStr);
        FS.showComplimentSheet(FS.getCompletionCompliment(), '+10 XP ⚡');
      } else {
        // Undo session — recurring: clear last_completed so it reappears
        task.sessions_done = Math.max(0, task.sessions_done - 1);
        if (task.status === 'done' && task.sessions_done < task.sessions_total) {
          task.status = 'pending';
          if (task.recurring) task.last_completed = null;
        }
        _data.sessions_log.splice(realIdx, 1);
        // Clean up study_days if no sessions remain today
        const stillHasToday = _data.sessions_log.some(s => s.date === todayStr);
        if (!stillHasToday) {
          _data.study_days = (_data.study_days || []).filter(d => d !== todayStr);
        }
      }

      FS.saveData(_data);
      renderPage();
    }

    function goAddTask() {
      _data = FS.loadData();
      const newId = 'manual_' + Date.now();
      const nextWeek = new Date();
      nextWeek.setDate(nextWeek.getDate() + 7);
      _data.tasks.push({
        id: newId, title: 'Nieuwe taak',
        deadline: nextWeek.toISOString().slice(0, 10),
        sessions_total: 1, sessions_done: 0, complexity: 'medium',
        subtasks: [], materials: [], status: 'pending', source: 'manual',
        magister_id: null, created_at: new Date().toISOString().slice(0, 10)
      });
      FS.saveData(_data);
      sessionStorage.setItem('enrichment_queue', JSON.stringify([newId]));
      window.location.href = '01.4-taak-aanmaken.html';
    }
  </script>
</body>
</html>
