<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — Connect Magister</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } }
    }
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">

  <!-- App Header (minimal — no nav during setup) -->
  <header class="flex items-center px-4 py-4 border-b border-gray-100">
    <a id="magister-sync-navigatie-terug-link"
       href="01.1-welkomst.html"
       class="text-gray-500 hover:text-gray-800 transition-colors text-sm font-medium flex items-center gap-1">
      ← Terug
    </a>
    <span class="flex-1 text-center font-bold text-gray-900">✦ FlowState</span>
    <div class="w-12"></div><!-- spacer -->
  </header>

  <main class="flex-1 px-6 py-8 max-w-sm mx-auto w-full">

    <!-- Section: Formulier -->
    <h1 id="magister-sync-formulier-paginatitel"
        class="text-2xl font-semibold text-gray-900 mb-8">
      Verbinden met Magister
    </h1>

    <!-- Error state (hidden by default) -->
    <div id="magister-sync-formulier-foutmelding"
         class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3">
      Kan niet verbinden. Controleer je gegevens en probeer opnieuw.
    </div>

    <form id="magister-form" onsubmit="handleConnect(event)" class="space-y-5">

      <!-- School field -->
      <div>
        <label for="magister-sync-formulier-school-veld"
               class="block text-sm font-medium text-gray-700 mb-1.5">
          School (Magister-domein)
        </label>
        <div class="flex items-center border border-gray-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/30 focus-within:border-primary transition-colors">
          <input id="magister-sync-formulier-school-veld"
                 type="text"
                 autocomplete="off"
                 placeholder="lmc-vo"
                 oninput="updateConnectBtn()"
                 class="flex-1 px-4 py-3 text-sm outline-none bg-transparent">
          <span class="pr-4 text-xs text-gray-400 whitespace-nowrap">.magister.net</span>
        </div>
      </div>

      <!-- Username field -->
      <div>
        <label for="magister-sync-formulier-gebruikersnaam-veld"
               class="block text-sm font-medium text-gray-700 mb-1.5">
          Gebruikersnaam of e-mail
        </label>
        <input id="magister-sync-formulier-gebruikersnaam-veld"
               type="text"
               autocomplete="username"
               placeholder="evelien"
               oninput="updateConnectBtn()"
               class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
      </div>

      <!-- Password field -->
      <div>
        <label for="magister-sync-formulier-wachtwoord-veld"
               class="block text-sm font-medium text-gray-700 mb-1.5">
          Wachtwoord
        </label>
        <div class="relative">
          <input id="magister-sync-formulier-wachtwoord-veld"
                 type="password"
                 autocomplete="current-password"
                 placeholder="••••••••"
                 oninput="updateConnectBtn()"
                 class="w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors">
          <button type="button"
                  onclick="togglePassword()"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg">
            👁
          </button>
        </div>
      </div>

      <!-- Connect button -->
      <button id="magister-sync-formulier-verbinden-knop"
              type="submit"
              disabled
              class="w-full bg-primary text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-150 flex items-center justify-center gap-2 shadow-lg shadow-indigo-200 disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none mt-4">
        <span id="connect-label">Verbinden →</span>
        <span id="connect-spinner" class="hidden animate-spin text-lg">⟳</span>
      </button>

    </form>

    <p class="mt-6 text-xs text-gray-400 text-center leading-relaxed">
      Je gegevens worden alleen gebruikt om huiswerk op te halen.<br>
      Ze worden niet opgeslagen op onze servers.
    </p>

  </main>

  <script>
    const WORKER_URL = 'https://flowstate-proxy.flowstate-evelien.workers.dev';

    let showingPassword = false;

    // Pre-fill school from saved settings
    (async () => {
      const data = await FS.initData();
      if (data.settings.magister_school) {
        document.getElementById('magister-sync-formulier-school-veld').value = data.settings.magister_school;
      }
      updateConnectBtn();
    })();

    function updateConnectBtn() {
      const school = document.getElementById('magister-sync-formulier-school-veld').value.trim();
      const user   = document.getElementById('magister-sync-formulier-gebruikersnaam-veld').value.trim();
      const pass   = document.getElementById('magister-sync-formulier-wachtwoord-veld').value;
      document.getElementById('magister-sync-formulier-verbinden-knop').disabled = !(school && user && pass);
    }

    function togglePassword() {
      const field = document.getElementById('magister-sync-formulier-wachtwoord-veld');
      showingPassword = !showingPassword;
      field.type = showingPassword ? 'text' : 'password';
    }

    async function handleConnect(e) {
      e.preventDefault();
      const btn     = document.getElementById('magister-sync-formulier-verbinden-knop');
      const label   = document.getElementById('connect-label');
      const spinner = document.getElementById('connect-spinner');
      const error   = document.getElementById('magister-sync-formulier-foutmelding');

      let school   = document.getElementById('magister-sync-formulier-school-veld').value.trim();
      const username = document.getElementById('magister-sync-formulier-gebruikersnaam-veld').value.trim();
      const password = document.getElementById('magister-sync-formulier-wachtwoord-veld').value;

      // Normalise school slug
      school = school.replace(/\.magister\.net$/, '');

      btn.disabled = true;
      label.textContent = 'Verbinden…';
      spinner.classList.remove('hidden');
      error.classList.add('hidden');

      try {
        const resp = await fetch(`${WORKER_URL}/auth`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ school, username, password }),
        });
        const result = await resp.json();

        if (!resp.ok) {
          throw new Error(result.error || 'Verbinding mislukt');
        }

        // Save credentials & token (no password stored)
        const data = await FS.initData();
        data.settings.magister_connected = true;
        data.settings.magister_school    = school;
        data.settings.magister_username  = username;
        data.settings.magister_token     = result.access_token;
        data.settings.magister_person_id = result.person_id;
        data.settings.magister_expires_at = result.expires_at;
        FS.saveData(data);

        window.location.href = '01.3-import-review.html';
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('hidden');
        btn.disabled = false;
        label.textContent = 'Verbinden →';
        spinner.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
