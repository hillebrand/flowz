<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Account aanmaken</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-white min-h-screen flex flex-col">

  <main class="flex-1 flex flex-col justify-center px-6 py-10 max-w-sm mx-auto w-full">

    <div class="text-center mb-10">
      <div class="flex justify-center mb-4">
        <img src="assets/logo-light.svg" alt="Flowz" class="h-10 w-auto">
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Account aanmaken</h1>
      <p class="text-sm text-gray-400 mt-1">Zo zijn je taken op elk apparaat beschikbaar</p>
    </div>

    <form id="register-form" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Voornaam</label>
        <input id="name"
               type="text" autocomplete="given-name" required
               placeholder="Voornaam"
               class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">E-mailadres</label>
        <input id="email"
               type="email" autocomplete="email" required
               placeholder="E-mailadres"
               class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Wachtwoord</label>
        <input id="password"
               type="password" autocomplete="new-password" required minlength="8"
               placeholder="Minimaal 8 tekens"
               class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Wachtwoord herhalen</label>
        <input id="password2"
               type="password" autocomplete="new-password" required
               placeholder="••••••••"
               class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>

      <div id="error-msg"
           class="hidden text-sm text-red-500 bg-red-50 px-4 py-3 rounded-2xl"></div>

      <button type="button" id="submit-btn" onclick="handleRegister()"
              class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-2xl shadow-sm shadow-indigo-200 transition-all active:scale-98 mt-2">
        Account aanmaken
      </button>

    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
      Al een account?
      <a href="00.1-login.html" class="text-primary font-medium hover:underline">Inloggen</a>
    </p>

  </main>

  <script>
    const WORKER_URL = 'https://flowstate-proxy.flowstate-evelien.workers.dev';

    async function handleRegister() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error-msg');

      errorEl.classList.add('hidden');

      if (!name || !email || !password) {
        showError('Vul alle velden in');
        return;
      }

      if (password !== password2) {
        showError('Wachtwoorden komen niet overeen');
        return;
      }
      if (password.length < 8) {
        showError('Wachtwoord moet minimaal 8 tekens zijn');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Bezig…';

      try {
        const r = await fetch(`${WORKER_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const body = await r.json();
        if (!r.ok) {
          showError(body.error || 'Registreren mislukt');
          return;
        }
        localStorage.setItem('flowz_auth_token', body.token);
        localStorage.setItem('flowz_user_email', email);
        localStorage.setItem('flowz_pending_name', name);
        window.location.replace('index.html');
      } catch (err) {
        showError('Geen verbinding. Probeer het opnieuw.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Account aanmaken';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
