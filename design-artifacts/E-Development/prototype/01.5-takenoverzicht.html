<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — All Tasks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } } }</script>
  <link rel="manifest" href="manifest.json">
  <script src="shared/app.js"></script>
  <script src="shared/nav.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- App Header -->
  <header class="bg-white flex items-center px-4 py-4 border-b border-gray-100 sticky top-0 z-30">
    <button onclick="openNav()" class="text-gray-600 hover:text-gray-900 text-xl w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-colors">☰</button>
    <span id="takenoverzicht-header-paginatitel" class="flex-1 text-center font-bold text-gray-900">Alle taken</span>
    <a href="04.1-instellingen.html" class="text-gray-600 hover:text-gray-900 text-xl w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-colors">👤</a>
  </header>

  <!-- View toggle + filter bar -->
  <div class="bg-white border-b border-gray-100 px-4 py-2 sticky top-16 z-20">
    <div class="max-w-sm mx-auto flex items-center gap-2">
      <div class="flex bg-gray-100 rounded-xl p-1 gap-1">
        <button id="view-list-btn" onclick="setView('list')"
                class="text-xs px-3 py-1.5 rounded-lg font-medium transition-all bg-white text-primary shadow-sm">
          ☰ Lijst
        </button>
        <button id="view-cal-btn" onclick="setView('calendar')"
                class="text-xs px-3 py-1.5 rounded-lg font-medium transition-all text-gray-500">
          📅 Kalender
        </button>
      </div>
      <button onclick="toggleFilter()"
              class="ml-auto text-xs text-gray-500 border border-gray-200 px-3 py-1.5 rounded-xl hover:bg-gray-50 transition-colors">
        Filter ▾
      </button>
    </div>
  </div>

  <main class="flex-1 px-4 py-4 max-w-sm mx-auto w-full pb-24">

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16">
      <div class="text-4xl mb-3">🌟</div>
      <p class="text-gray-500 text-sm">Nog geen taken —super gedaan!<br>Of voeg er handmatig een toe.</p>
    </div>

    <!-- Task groups (list view) -->
    <div id="task-groups"></div>

    <!-- Calendar view -->
    <div id="calendar-view" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <button onclick="prevMonth()" class="text-gray-400 hover:text-gray-700 w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100">‹</button>
        <span id="cal-month-label" class="text-sm font-semibold text-gray-800"></span>
        <button onclick="nextMonth()" class="text-gray-400 hover:text-gray-700 w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100">›</button>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-2">
        <div class="text-center text-xs text-gray-400 font-medium py-1">Ma</div>
        <div class="text-center text-xs text-gray-400 font-medium py-1">Di</div>
        <div class="text-center text-xs text-gray-400 font-medium py-1">Wo</div>
        <div class="text-center text-xs text-gray-400 font-medium py-1">Do</div>
        <div class="text-center text-xs text-gray-400 font-medium py-1">Vr</div>
        <div class="text-center text-xs text-gray-400 font-medium py-1">Za</div>
        <div class="text-center text-xs text-gray-400 font-medium py-1">Zo</div>
      </div>
      <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
      <!-- Tasks for selected day -->
      <div id="cal-day-tasks" class="hidden mt-4">
        <h3 id="cal-day-label" class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3"></h3>
        <div id="cal-day-list" class="space-y-2"></div>
      </div>
    </div>

  </main>

  <!-- FAB -->
  <a id="takenoverzicht-acties-nieuwe-taak-fab"
     href="01.4-taak-aanmaken.html"
     onclick="prepNewTask(event)"
     class="fixed bottom-6 right-6 bg-primary hover:bg-primary-dark text-white font-semibold px-5 py-3.5 rounded-2xl shadow-lg shadow-indigo-300 flex items-center gap-2 transition-all active:scale-95 z-20">
    + Nieuwe taak
  </a>

  <script>
    injectNav('tasks');

    let currentView = 'list';
    let calYear, calMonth;

    const GROUPS = [
      { key: 'urgent',    label: '🔴 DRINGEND',    color: 'text-red-500' },
      { key: 'this_week', label: '🟡 DEZE WEEK',   color: 'text-yellow-500' },
      { key: 'upcoming',  label: '🟢 AANKOMEND',   color: 'text-green-500' },
    ];

    (async function() {
      await FS.initData();
      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      render();
    })();

    function setView(v) {
      currentView = v;
      const listBtn = document.getElementById('view-list-btn');
      const calBtn = document.getElementById('view-cal-btn');
      const taskGroups = document.getElementById('task-groups');
      const calView = document.getElementById('calendar-view');
      if (v === 'list') {
        listBtn.className = 'text-xs px-3 py-1.5 rounded-lg font-medium transition-all bg-white text-primary shadow-sm';
        calBtn.className = 'text-xs px-3 py-1.5 rounded-lg font-medium transition-all text-gray-500';
        taskGroups.classList.remove('hidden');
        calView.classList.add('hidden');
      } else {
        calBtn.className = 'text-xs px-3 py-1.5 rounded-lg font-medium transition-all bg-white text-primary shadow-sm';
        listBtn.className = 'text-xs px-3 py-1.5 rounded-lg font-medium transition-all text-gray-500';
        taskGroups.classList.add('hidden');
        calView.classList.remove('hidden');
        renderCalendar();
      }
    }

    function toggleFilter() {
      alert('Filter: binnenkort beschikbaar');
    }

    function render() {
      const data = FS.loadData();
      const tasks = data.tasks.filter(t => t.status !== 'done');

      if (tasks.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('task-groups').classList.add('hidden');
        return;
      }

      const grouped = { urgent: [], this_week: [], upcoming: [] };
      tasks.forEach(t => {
        const g = FS.getUrgency(t.deadline);
        if (grouped[g]) grouped[g].push(t);
      });

      const html = GROUPS
        .filter(g => grouped[g.key].length > 0)
        .map(g => `
          <div class="mb-6">
            <div class="flex items-center gap-2 mb-3 px-1">
              <span class="text-xs font-bold tracking-widest ${g.color}">${g.label}</span>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>
            <div class="space-y-2">
              ${grouped[g.key].map(taskCard).join('')}
            </div>
          </div>
        `).join('');

      document.getElementById('task-groups').innerHTML = html || '';
    }

    function renderCalendar() {
      const data = FS.loadData();
      const tasks = data.tasks.filter(t => t.status !== 'done');

      // Build deadline map
      const deadlineMap = {};
      tasks.forEach(t => {
        if (!deadlineMap[t.deadline]) deadlineMap[t.deadline] = [];
        deadlineMap[t.deadline].push(t);
      });

      const now = new Date();
      const firstDay = new Date(calYear, calMonth, 1);
      const lastDay = new Date(calYear, calMonth + 1, 0);

      document.getElementById('cal-month-label').textContent =
        firstDay.toLocaleDateString('nl', { month: 'long', year: 'numeric' });

      // Monday-first offset
      let startDow = firstDay.getDay(); // 0=Sun
      startDow = startDow === 0 ? 6 : startDow - 1; // 0=Mon

      let html = '';
      for (let i = 0; i < startDow; i++) html += '<div></div>';

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = dateStr === now.toISOString().slice(0,10);
        const hasDeadline = deadlineMap[dateStr];
        const dotColor = hasDeadline
          ? (FS.getUrgency(dateStr) === 'urgent' ? 'bg-red-500' : FS.getUrgency(dateStr) === 'this_week' ? 'bg-yellow-400' : 'bg-green-400')
          : '';

        html += `
          <button onclick="selectCalDay('${dateStr}', ${d})"
                  class="aspect-square flex flex-col items-center justify-center rounded-xl text-sm transition-all hover:bg-indigo-50
                    ${isToday ? 'bg-primary text-white font-bold' : 'text-gray-700'}
                    ${hasDeadline && !isToday ? 'bg-indigo-50 font-medium' : ''}">
            <span>${d}</span>
            ${hasDeadline ? `<span class="w-1.5 h-1.5 rounded-full ${isToday ? 'bg-white' : dotColor} mt-0.5"></span>` : '<span class="w-1.5 h-1.5 mt-0.5"></span>'}
          </button>`;
      }
      document.getElementById('cal-grid').innerHTML = html;
      document.getElementById('cal-day-tasks').classList.add('hidden');
    }

    function selectCalDay(dateStr, dayNum) {
      const data = FS.loadData();
      const tasks = data.tasks.filter(t => t.deadline === dateStr && t.status !== 'done');
      const panel = document.getElementById('cal-day-tasks');
      const label = document.getElementById('cal-day-label');
      const list = document.getElementById('cal-day-list');

      const d = new Date(dateStr);
      label.textContent = d.toLocaleDateString('nl', { weekday: 'long', day: 'numeric', month: 'long' });

      if (tasks.length === 0) {
        list.innerHTML = '<p class="text-xs text-gray-400 italic">Geen deadlines op deze dag</p>';
      } else {
        list.innerHTML = tasks.map(taskCard).join('');
      }
      panel.classList.remove('hidden');
    }

    function prevMonth() {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    }
    function nextMonth() {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }

    function taskCard(t) {
      const sessions = `${t.sessions_done}/${t.sessions_total}s`;
      const prio = t.priority || 'normal';
      const prioBadge = prio === 'high' ? '<span class="text-xs text-red-500 font-medium">🔴 Hoog</span>'
                      : prio === 'low'  ? '<span class="text-xs text-blue-400 font-medium">🔵 Laag</span>'
                      : '';
      return `
        <a href="03.1-taak-detail.html?id=${t.id}"
           class="flex items-center gap-3 bg-white rounded-2xl px-4 py-4 shadow-sm border border-gray-100 hover:border-primary/30 hover:shadow-md transition-all active:scale-98 block">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 mb-0.5">
              <div id="takenoverzicht-takenlijst-taaknaam"
                   class="text-sm font-medium text-gray-900 truncate">${t.title}</div>
              ${prioBadge}
            </div>
            <div id="takenoverzicht-takenlijst-deadline-en-sessies"
                 class="text-xs text-gray-400">${FS.formatDeadline(t.deadline)} · ${sessions}</div>
          </div>
          <span class="text-lg">›</span>
        </a>
      `;
    }

    function prepNewTask(e) {
      // For manually adding a new task: create empty task and go to enrichment
      e.preventDefault();
      const data = FS.loadData();
      const newId = 'manual_' + Date.now();
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 7);
      data.tasks.push({
        id: newId,
        title: 'Nieuwe taak',
        subject: 'Other',
        deadline: tomorrow.toISOString().slice(0, 10),
        sessions_total: 1, sessions_done: 0,
        complexity: 'medium', subtasks: [], materials: [],
        status: 'pending', source: 'manual', magister_id: null,
        created_at: new Date().toISOString().slice(0, 10),
        needs_enrichment: true
      });
      FS.saveData(data);
      sessionStorage.setItem('enrichment_queue', JSON.stringify([newId]));
      window.location.href = '01.4-taak-aanmaken.html';
    }
  </script>
</body>
</html>
