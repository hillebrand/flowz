<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=19"></script>
</head>
<body class="bg-white font-karla">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Smart entry: send user to right place
    (async function() {
      await FS.initData();
      if (!FS.isSetupDone()) {
        window.location.href = '01.1-welkomst.html';
      } else {
        const energy = FS.getTodayEnergy();
        if (!energy) {
          window.location.href = '02.1-energie-check-in.html';
        } else {
          window.location.href = '02.2-shortlist-vandaag.html';
        }
      }
    })();
  </script>
  <div class="flex items-center justify-center h-screen">
    <div class="text-center text-gray-400">
      <div class="flex justify-center mb-2">
        <span class="font-bold text-2xl text-gray-900">Flowz</span>
      </div>
      <p class="text-sm">Flowz laden…</p>
    </div>
  </div>
</body>
</html>
