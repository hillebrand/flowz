<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Session Done</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=21"></script>
  <style>
    @keyframes popIn  { 0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
    @keyframes mimeDance {
      0%,100% { transform: rotate(-10deg) scale(1);    }
      25%     { transform: rotate( 10deg) scale(1.18); }
      50%     { transform: rotate(- 6deg) scale(1.06); }
      75%     { transform: rotate(  6deg) scale(1.22); }
    }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    .pop-in     { animation: popIn    0.5s cubic-bezier(.175,.885,.32,1.275) forwards; }
    .mime-dance { animation: mimeDance 0.75s ease-in-out infinite; display:inline-block; }
    .slide-up   { animation: slideUp  0.5s cubic-bezier(.22,.68,0,1.4) 0.15s both; }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col font-karla">

  <main class="flex-1 flex flex-col items-center justify-center px-6 py-10 max-w-sm mx-auto w-full text-center">

    <div id="sessie-afgerond-bevestiging-beloning-emoji" class="mb-4 pop-in">
      <span id="sessie-done-illustration" class="pop-in" style="font-size:80px;line-height:1;display:inline-block">🎉</span>
    </div>

    <h1 id="sessie-afgerond-bevestiging-hoofd-boodschap"
        class="text-2xl font-bold text-gray-900 mb-3">Sessie afgerond!</h1>

    <div class="slide-up bg-gray-50 rounded-2xl px-5 py-4 w-full mb-4">
      <p id="sessie-afgerond-bevestiging-compliment"
         class="text-lg font-bold text-gray-900 mb-1 leading-snug"></p>
      <p id="sessie-afgerond-xp" class="text-sm font-semibold text-indigo-500"></p>
    </div>

    <p id="sessie-afgerond-bevestiging-sessie-context"
       class="text-sm text-gray-400 mb-6"></p>

    <!-- Progress dots -->
    <div class="bg-gray-50 rounded-2xl px-5 py-4 w-full mb-8">
      <div id="session-dots" class="flex gap-2 justify-center"></div>
    </div>

    <!-- Actions -->
    <div class="w-full space-y-3">
      <button id="sessie-afgerond-acties-pauze-starten-knop"
              onclick="goBreak()"
              class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-98">
        Pauze nemen →
      </button>
      <button id="sessie-afgerond-acties-terug-naar-shortlist-knop"
              onclick="goShortlist()"
              class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-4 rounded-2xl transition-all active:scale-98">
        Terug naar vandaag
      </button>
    </div>

  </main>

  <script>
    (async function() {
      await FS.initData();
      const params = new URLSearchParams(window.location.search);
      const taskId = params.get('id');

      const data = FS.loadData();
      const task = data.tasks.find(t => t.id === taskId);
      if (!task) { window.location.href = '02.2-shortlist-vandaag.html'; return; }

      const done = task.sessions_done;
      const total = task.sessions_total;
      const allDone = done >= total;

      if (allDone) {
      document.getElementById('sessie-done-illustration').textContent = '🏆';
        document.getElementById('sessie-afgerond-bevestiging-hoofd-boodschap').textContent = 'Taak voltooid! 🏆';
      }

      document.getElementById('sessie-afgerond-bevestiging-compliment').textContent =
        FS.getCompletionCompliment();
      document.getElementById('sessie-afgerond-xp').textContent = '+10 XP ⚡';

      document.getElementById('sessie-afgerond-bevestiging-sessie-context').textContent =
        `${task.title} · Sessie ${done} van ${total}`;


      document.getElementById('session-dots').innerHTML =
        Array.from({ length: total }, (_, i) =>
          `<div class="w-4 h-4 rounded-full ${i < done ? 'bg-primary' : 'bg-gray-200'}"></div>`
        ).join('');

      // Store taskId for break page
      sessionStorage.setItem('last_task_id', taskId);
    })();

    function goBreak() {
      window.location.href = '03.6-pauzetimer.html';
    }
    function goShortlist() {
      window.location.href = '02.2-shortlist-vandaag.html';
    }
  </script>
</body>
</html>
