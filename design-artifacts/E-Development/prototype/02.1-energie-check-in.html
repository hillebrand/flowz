<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Check-in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=21"></script>
  <script src="shared/nav.js"></script>
  <style>
    /* Hide native range thumb and track so we can render our own */
    #time-range { -webkit-appearance: none; appearance: none; background: transparent; }
    #time-range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); cursor: pointer; border: 2px solid #e5e7eb; margin-top: -8px; }
    #time-range::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); cursor: pointer; border: 2px solid #e5e7eb; }
    #time-range::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; }
    #time-range::-moz-range-track { height: 12px; border-radius: 6px; }
    #time-range:focus { outline: none; }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col font-karla">

  <!-- App Header -->
  <header class="bg-white border-b border-gray-100 flex items-center px-4 py-3">
    <button onclick="openNav()" class="text-gray-700 hover:opacity-70 w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-opacity"><svg viewBox="0 0 30 22" fill="none" class="w-6 h-5"><rect y="0" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="9.1" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="18.4" width="30" height="2.6" rx="1.3" fill="currentColor"/></svg></button>
    <span class="flex-1 flex justify-center"><span class="font-bold text-xl text-gray-900">Flowz</span></span>
    <a href="04.1-instellingen.html" class="text-gray-700 hover:opacity-70 w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-opacity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></a>
  </header>

  <main class="flex-1 flex flex-col px-8 py-10 max-w-sm mx-auto w-full">

    <h2 id="checkin-begroeting" class="text-2xl font-semibold text-gray-900 mb-10"></h2>

    <!-- Step indicator -->
    <div class="flex gap-2 mb-8">
      <div id="dot-1" class="h-1.5 rounded-full flex-1 bg-primary transition-all"></div>
      <div id="dot-2" class="h-1.5 rounded-full flex-1 bg-gray-200 transition-all"></div>
    </div>

    <!-- Step 1: Tijdslider -->
    <div id="step-time">
      <h3 class="text-base font-medium text-gray-600 mb-6">Hoeveel tijd heb je voor huiswerk?</h3>

      <!-- Time display -->
      <div class="text-center mb-6">
        <div id="time-display" class="text-4xl font-bold transition-colors" style="color:#6366f1">2,5 uur</div>
        <div id="zone-feedback" class="text-sm text-gray-400 mt-2 min-h-[40px]"></div>
      </div>

      <!-- Slider track (visual) -->
      <div class="relative mb-2">
        <div id="slider-track-bg" class="w-full h-3 rounded-full" style="background: linear-gradient(to right, #ef4444 0%, #ef4444 33%, #fb923c 33%, #fb923c 55%, #22c55e 55%, #22c55e 100%)"></div>
        <input type="range" id="time-range"
               min="0" max="300" step="30" value="150"
               class="absolute inset-0 w-full h-full cursor-pointer"
               oninput="onSliderInput(this.value)"
               style="margin-top:-4px">
      </div>

      <!-- Scale labels -->
      <div class="flex justify-between text-xs text-gray-400 mb-8 px-0.5">
        <span>0 min</span>
        <span>1 uur</span>
        <span>2,5 uur</span>
        <span>4 uur</span>
        <span>5 uur</span>
      </div>

      <button id="time-next-btn" onclick="confirmTime()"
              class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-98">
        Volgende →
      </button>
    </div>

    <!-- Step 2: Energie -->
    <div id="step-energy" class="hidden">
      <h3 class="text-base font-medium text-gray-600 mb-6">Hoe voel jij je vandaag?</h3>
      <div class="space-y-3">
        <button data-energy="low"    onclick="selectEnergy('low')"    class="energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-medium text-base transition-all hover:border-primary/40 hover:bg-indigo-50/30">
          <span class="flex items-center gap-3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><rect x="2" y="7" width="16" height="10" rx="1.5"/><path d="M18 10.5v3H22v-3h-4"/><rect x="4" y="9" width="4" height="6" rx="0.5" fill="currentColor" stroke="none"/></svg>Laag</span>
        </button>
        <button data-energy="normal" onclick="selectEnergy('normal')" class="energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-medium text-base transition-all hover:border-primary/40 hover:bg-indigo-50/30">
          <span class="flex items-center gap-3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><rect x="2" y="7" width="16" height="10" rx="1.5"/><path d="M18 10.5v3H22v-3h-4"/><rect x="4" y="9" width="8" height="6" rx="0.5" fill="currentColor" stroke="none"/></svg>Normaal</span>
        </button>
        <button data-energy="high"   onclick="selectEnergy('high')"   class="energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-medium text-base transition-all hover:border-primary/40 hover:bg-indigo-50/30">
          <span class="flex items-center gap-3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0"><path d="M13 2L4 14h7l-1 8 10-12h-7l1-8z" fill="currentColor" stroke="none"/></svg>Hoog</span>
        </button>
      </div>
      <button id="energy-confirm-btn" onclick="confirmEnergy()"
              class="hidden mt-6 w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-98">
        Starten →
      </button>
    </div>

    </main>

  <script>
    injectNav('checkin');

    const MAX_MINUTES = 300;
    let _selectedMinutes = 150;
    let _selectedEnergy  = null;
    let _zones = { thresholdRed: 0, thresholdGreen: 0 };

    const BTN_DEFAULT  = 'w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-medium text-base transition-all hover:border-primary/40 hover:bg-indigo-50/30';
    const BTN_SELECTED = 'w-full text-left px-5 py-4 rounded-2xl border-2 border-primary bg-primary/10 text-primary scale-105 shadow-md shadow-indigo-100 font-medium text-base transition-all';

    function minutesToDisplay(min) {
      if (min === 0) return '0 min';
      const h = Math.floor(min / 60);
      const m = min % 60;
      if (h === 0) return `${m} min`;
      if (m === 0) return h === 1 ? '1 uur' : `${h} uur`;
      return `${h},${Math.round(m / 6)} uur`;
    }

    function getZone(min) {
      if (_zones.thresholdRed === 0) return 'green';
      if (min < _zones.thresholdRed) return 'red';
      if (min < _zones.thresholdGreen) return 'orange';
      return 'green';
    }

    const ZONE_COLORS = { red: '#ef4444', orange: '#fb923c', green: '#22c55e' };

    function updateSliderUI(min) {
      _selectedMinutes = min;
      const zone = getZone(min);
      const color = ZONE_COLORS[zone];
      document.getElementById('time-display').textContent = minutesToDisplay(min);
      document.getElementById('time-display').style.color = color;
      document.getElementById('zone-feedback').textContent = FS.getSliderFeedback(zone, _zones.thresholdRed);

      // Update slider track gradient to show filled portion
      const pct = Math.round((min / MAX_MINUTES) * 100);
      const redPct   = Math.round((_zones.thresholdRed / MAX_MINUTES) * 100);
      const greenPct = Math.round((_zones.thresholdGreen / MAX_MINUTES) * 100);

      // Gradient: filled with zone colors up to current, gray after
      let gradient;
      if (redPct === 0) {
        gradient = `linear-gradient(to right, #22c55e 0%, #22c55e ${pct}%, #e5e7eb ${pct}%, #e5e7eb 100%)`;
      } else {
        const stops = [
          `#ef4444 0%`,
          `#ef4444 ${Math.min(pct, redPct)}%`,
        ];
        if (pct > redPct) {
          stops.push(`#fb923c ${redPct}%`);
          stops.push(`#fb923c ${Math.min(pct, greenPct)}%`);
        }
        if (pct > greenPct) {
          stops.push(`#22c55e ${greenPct}%`);
          stops.push(`#22c55e ${pct}%`);
        }
        stops.push(`#e5e7eb ${pct}%`);
        stops.push(`#e5e7eb 100%`);
        gradient = `linear-gradient(to right, ${stops.join(', ')})`;
      }
      document.getElementById('slider-track-bg').style.background = gradient;
    }

    function onSliderInput(val) {
      updateSliderUI(parseInt(val, 10));
    }

    (async function() {
      const data = await FS.initData();
      const checkin = FS.getTodayCheckin();
      if (checkin?.energy && checkin?.minutes != null) {
        window.location.href = '02.2-shortlist-vandaag.html';
        return;
      }
      document.getElementById('checkin-begroeting').textContent =
        FS.getGreeting(data.settings.name || 'aardling');

      // Calculate zones and set macro default
      _zones = FS.calculateZones(data.tasks || [], data.settings || {}, new Date());
      const macroMinutes = FS.getCapacityForDate(data.settings || {}, new Date());
      const initial = macroMinutes > 0 ? macroMinutes : 150;
      _selectedMinutes = Math.min(initial, MAX_MINUTES);
      document.getElementById('time-range').value = _selectedMinutes;
      updateSliderUI(_selectedMinutes);
    })();

    function confirmTime() {
      document.getElementById('dot-2').classList.replace('bg-gray-200', 'bg-primary');
      const s1 = document.getElementById('step-time');
      s1.style.transition = 'opacity 0.2s';
      s1.style.opacity = '0';
      setTimeout(() => {
        s1.classList.add('hidden');
        const s2 = document.getElementById('step-energy');
        s2.classList.remove('hidden');
        s2.style.opacity = '0';
        s2.style.transition = 'opacity 0.2s';
        requestAnimationFrame(() => { s2.style.opacity = '1'; });
      }, 200);
    }

    function selectEnergy(level) {
      _selectedEnergy = level;
      document.querySelectorAll('[data-energy]').forEach(btn => {
        btn.className = btn.dataset.energy === level ? BTN_SELECTED : BTN_DEFAULT;
      });
      document.getElementById('energy-confirm-btn').classList.remove('hidden');
    }

    function confirmEnergy() {
      FS.setTodayCheckin(_selectedEnergy, _selectedMinutes);
      window.location.href = '02.2-shortlist-vandaag.html';
    }
  </script>
</body>
</html>
