<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — How are you feeling?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=7"></script>
  <script src="shared/nav.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">

  <!-- App Header -->
  <header class="flex items-center px-4 py-4 border-b border-gray-100">
    <button onclick="openNav()" class="text-gray-600 hover:text-gray-900 text-xl w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-colors">☰</button>
    <span class="flex-1 text-center font-bold text-gray-900">✦ FlowState</span>
    <a href="04.1-instellingen.html" class="text-gray-600 hover:text-gray-900 text-xl w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-colors">👤</a>
  </header>

  <main class="flex-1 flex flex-col px-8 py-10 max-w-sm mx-auto w-full">

    <!-- Section: Begroeting -->
    <h2 id="energie-check-in-begroeting-welkomstgroet"
        class="text-2xl font-semibold text-gray-900 mb-10"></h2>

    <!-- Section: Energie Check-in -->
    <h3 id="energie-check-in-energie-check-in-energievraag"
        class="text-base font-medium text-gray-600 mb-6">
      Hoe voel jij je vandaag?
    </h3>

    <div class="space-y-3 flex-1">
      <button id="energie-check-in-energie-check-in-knop-laag"
              onclick="selectEnergy('low')"
              data-energy="low"
              class="energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-medium text-base transition-all hover:border-primary/40 hover:bg-indigo-50/30 active:scale-98">
        😴  Laag
      </button>
      <button id="energie-check-in-energie-check-in-knop-normaal"
              onclick="selectEnergy('normal')"
              data-energy="normal"
              class="energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-medium text-base transition-all hover:border-primary/40 hover:bg-indigo-50/30 active:scale-98">
        😊  Normaal
      </button>
      <button id="energie-check-in-energie-check-in-knop-hoog"
              onclick="selectEnergy('high')"
              data-energy="high"
              class="energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 border-gray-200 text-gray-700 font-medium text-base transition-all hover:border-primary/40 hover:bg-indigo-50/30 active:scale-98">
        ⚡  Hoog
      </button>
    </div>

    <!-- Section: Info -->
    <p id="energie-check-in-info-taakteller"
       class="text-sm text-gray-400 text-center mt-8"></p>

  </main>

  <script>
    injectNav('checkin');

    (async function() {
      const data = await FS.initData();
      const params = new URLSearchParams(window.location.search);
      const changing = params.get('change') === '1';

      // Only auto-skip if energy is set AND we're not explicitly changing it
      if (!changing && FS.getTodayEnergy()) {
        window.location.href = '02.2-shortlist-vandaag.html';
        return;
      }

      // Pre-select current energy if changing
      const current = FS.getTodayEnergy();
      if (current) {
        document.querySelectorAll('.energy-btn').forEach(btn => {
          if (btn.dataset.energy === current) {
            btn.className = 'energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 font-medium text-base transition-all border-primary bg-primary/10 text-primary scale-105 shadow-md shadow-indigo-100';
          }
        });
      }

      // Greeting
      document.getElementById('energie-check-in-begroeting-welkomstgroet').textContent =
        FS.getGreeting(data.settings.name || 'aardling');

      // Task counter
      const pending = data.tasks.filter(t => t.status !== 'done').length;
      const counter = document.getElementById('energie-check-in-info-taakteller');
      if (pending > 0) {
        counter.textContent = `${pending} taak${pending !== 1 ? 'en' : ''} wachten op je`;
      }
    })();

    function selectEnergy(level) {
      // Highlight selected button
      document.querySelectorAll('.energy-btn').forEach(btn => {
        const isSelected = btn.dataset.energy === level;
        btn.className = 'energy-btn w-full text-left px-5 py-4 rounded-2xl border-2 font-medium text-base transition-all ' +
          (isSelected
            ? 'border-primary bg-primary/10 text-primary scale-105 shadow-md shadow-indigo-100'
            : 'border-gray-100 text-gray-400');
      });

      // Save and navigate after brief visual feedback
      setTimeout(() => {
        FS.setTodayEnergy(level);
        window.location.href = '02.2-shortlist-vandaag.html';
      }, 300);
    }
  </script>
</body>
</html>
