<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — Huiswerk importeren</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=14"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">

  <header class="flex items-center px-4 py-4 border-b border-gray-100">
    <a href="01.2-magister-sync.html" class="text-gray-500 hover:text-gray-800 text-sm font-medium flex items-center gap-1">← Terug</a>
    <span class="flex-1 text-center font-bold text-gray-900">✦ FlowState</span>
    <div class="w-12"></div>
  </header>

  <main class="flex-1 px-6 py-8 max-w-sm mx-auto w-full flex flex-col">

    <!-- Section: Header -->
    <h1 id="import-review-header-paginatitel"
        class="text-2xl font-semibold text-gray-900 mb-1">
      Nieuw huiswerk van Magister
    </h1>
    <p id="import-review-header-aantal-label"
       class="text-sm text-gray-400 mb-6"></p>

    <!-- Loading state -->
    <div id="loading-state" class="flex-1 flex flex-col items-center justify-center text-center py-12">
      <div class="text-3xl animate-spin mb-3">⟳</div>
      <p class="text-gray-400 text-sm">Huiswerk ophalen uit Magister…</p>
    </div>

    <!-- Empty state (no new items) -->
    <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center py-12">
      <div class="text-4xl mb-3">🎉</div>
      <p class="text-gray-500 text-sm">Je bent helemaal bij!<br>Geen nieuw huiswerk.</p>
    </div>

    <!-- Error state -->
    <div id="error-state" class="hidden mb-6 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3">
      <p>Er ging iets mis.</p>
      <a href="01.2-magister-sync.html" class="underline mt-1 block">Opnieuw verbinden →</a>
    </div>

    <!-- Section: Import Lijst -->
    <div id="import-list" class="hidden space-y-3 flex-1"></div>

    <!-- Section: Acties -->
    <div class="pt-6">
      <button id="import-review-acties-import-knop"
              onclick="doImport()"
              class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 px-6 rounded-2xl transition-all shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
        <span id="import-btn-label">Taken importeren →</span>
      </button>
    </div>

  </main>

  <script>
    let items = [];
    let selected = new Set();
    let newIds = new Set(); // IDs shown for the first time in this import

    const SEEN_KEY = 'flowstate_magister_seen_ids';

    function loadSeenIds() {
      try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY)) || []); }
      catch { return new Set(); }
    }

    function saveSeenIds(ids) {
      localStorage.setItem(SEEN_KEY, JSON.stringify([...ids]));
    }

    (async function () {
      // STEP 1: Persist Magister params immediately — BEFORE initData() which may
      // redirect to the login page, losing the URL params entirely.
      const urlParams   = new URLSearchParams(location.search);
      const urlToken    = urlParams.get('token');
      const urlPersonId = urlParams.get('person_id');
      const urlSchool   = urlParams.get('school');

      if (urlToken && urlPersonId && urlSchool &&
          urlPersonId !== 'undefined' && urlPersonId !== 'null') {
        localStorage.setItem('pending_magister_token',     urlToken);
        localStorage.setItem('pending_magister_person_id', urlPersonId);
        localStorage.setItem('pending_magister_school',    urlSchool);
        history.replaceState({}, '', '01.3-import-review.html');
      }

      // STEP 2: Init app (may redirect to login if unauthenticated).
      const data = await FS.initData();
      // initData() returns null when it redirects to login (browser is navigating away)
      if (!data) return;
      const s    = data.settings;

      // STEP 3: Apply pending params (present whether we just got them from the
      // URL or they survived a login-page redirect).
      const pToken    = localStorage.getItem('pending_magister_token');
      const pPersonId = localStorage.getItem('pending_magister_person_id');
      const pSchool   = localStorage.getItem('pending_magister_school');
      if (pToken && pPersonId && pSchool) {
        s.magister_connected  = true;
        s.magister_school     = pSchool;
        s.magister_token      = pToken;
        s.magister_person_id  = pPersonId;
        s.magister_expires_at = Date.now() + 55 * 60 * 1000;
        FS.saveData(data);
        localStorage.removeItem('pending_magister_token');
        localStorage.removeItem('pending_magister_person_id');
        localStorage.removeItem('pending_magister_school');
      }

      if (!s.magister_connected || !s.magister_token) {
        window.location.href = '01.2-magister-sync.html';
        return;
      }

      setLoading(true);

      try {
        // Token expired → re-auth not supported inline; redirect to reconnect
        if (s.magister_expires_at && Date.now() > s.magister_expires_at - 60_000) {
          showError('Je Magister-sessie is verlopen. Verbind opnieuw.');
          setLoading(false);
          return;
        }

        const from = new Date().toISOString().slice(0, 10);
        const to   = addDays(from, 90);
        const url  = `${WORKER_URL}/homework?school=${encodeURIComponent(s.magister_school)}&token=${encodeURIComponent(s.magister_token)}&person_id=${encodeURIComponent(s.magister_person_id)}&from=${from}&to=${to}`;

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        let resp, result;
        try {
          resp   = await fetch(url, { signal: controller.signal });
          result = await resp.json();
        } finally {
          clearTimeout(timer);
        }

        if (!resp.ok) throw new Error(result.error || 'Ophalen mislukt');

        const imported = new Set(data.tasks.filter(t => t.magister_id).map(t => t.magister_id));
        items = result.assignments.filter(a => !imported.has(a.id));

        // Determine which items are new (not seen in a previous import)
        const seenIds = loadSeenIds();
        newIds = new Set(items.filter(a => !seenIds.has(a.id)).map(a => a.id));
        // Mark all currently shown items as seen
        items.forEach(a => seenIds.add(a.id));
        saveSeenIds(seenIds);

        console.log('[Magister debug]', result._debug, 'total assignments:', result.assignments?.length, 'after filter:', items.length);

        if (items.length === 0) {
          const total = result.assignments?.length ?? 0;
          const alreadyIn = total - items.length;
          let debugMsg = total === 0
            ? 'Magister gaf 0 items terug.'
            : `Magister gaf ${total} items terug, maar ${alreadyIn} ${alreadyIn === 1 ? 'is' : 'zijn'} al geïmporteerd.`;
          document.getElementById('empty-state').classList.remove('hidden');
          document.getElementById('empty-state').querySelector('p').innerHTML =
            'Je bent helemaal bij!<br>Geen nieuw huiswerk.<br><span class="text-xs text-gray-400 mt-1 block">' + debugMsg + '</span>';
          document.getElementById('import-list').classList.add('hidden');
          document.getElementById('import-review-acties-import-knop').closest('div').classList.add('hidden');
          document.getElementById('import-review-header-aantal-label').textContent = '0 items gevonden';
          setLoading(false);
          return;
        }

        items.forEach(item => selected.add(item.id));
        renderList();
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    })();

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderList() {
      const list       = document.getElementById('import-list');
      const countLabel = document.getElementById('import-review-header-aantal-label');
      const newCount   = newIds.size;
      countLabel.textContent = newCount > 0
        ? `${items.length} item${items.length !== 1 ? 's' : ''} · ${newCount} nieuw`
        : `${items.length} item${items.length !== 1 ? 's' : ''} gevonden`;

      list.innerHTML = items.map(item => `
        <label class="flex items-start gap-3 p-4 border ${newIds.has(item.id) ? 'border-indigo-200 bg-indigo-50/40' : 'border-gray-200'} rounded-xl cursor-pointer hover:border-primary/40 hover:bg-indigo-50/30 transition-colors">
          <input type="checkbox"
                 id="cb-${esc(item.id)}"
                 ${selected.has(item.id) ? 'checked' : ''}
                 onchange="toggleItem('${esc(item.id)}')"
                 class="mt-0.5 accent-primary w-4 h-4 rounded">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-gray-900 truncate">${esc(item.title)}</span>
              ${newIds.has(item.id) ? '<span class="text-xs bg-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded font-semibold flex-shrink-0">NIEUW</span>' : ''}
              ${item.type && item.type !== 'Huiswerk' ? `<span class="text-xs bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-medium">${esc(item.type)}</span>` : ''}
            </div>
            <div class="text-xs text-gray-400 mt-0.5">
              ${item.subject ? `<span class="font-medium text-gray-500">${esc(item.subject)}</span> · ` : ''}Inleveren ${FS.formatDeadline(item.deadline)}
            </div>
            ${item.description ? `<div class="text-xs text-gray-400 mt-1 italic truncate">${esc(item.description).slice(0, 80)}${item.description.length > 80 ? '…' : ''}</div>` : ''}
          </div>
        </label>
      `).join('');

      updateImportBtn();
    }

    function toggleItem(id) {
      if (selected.has(id)) selected.delete(id);
      else selected.add(id);
      updateImportBtn();
    }

    function updateImportBtn() {
      const n = selected.size;
      document.getElementById('import-btn-label').textContent =
        n > 0 ? `${n} taak${n !== 1 ? 'en' : ''} importeren →` : 'Selecteer taken om te importeren';
      document.getElementById('import-review-acties-import-knop').disabled = n === 0;
    }

    async function doImport() {
      const data          = await FS.initData();
      const selectedItems = items.filter(i => selected.has(i.id));
      const newTasks      = selectedItems.map(i => ({
        id:               'mg_' + Date.now() + '_' + i.id,
        title:            i.title,
        subject:          i.subject,
        type:             i.type || null,
        description:      i.description || '',
        deadline:         i.deadline,
        sessions_total:   1,
        sessions_done:    0,
        complexity:       'medium',
        subtasks:         [],
        materials:        [],
        status:           'pending',
        source:           'magister',
        magister_id:      i.id,
        created_at:       new Date().toISOString().slice(0, 10),
        needs_enrichment: true,
      }));

      data.tasks.push(...newTasks);
      FS.saveData(data);

      sessionStorage.setItem('enrichment_queue', JSON.stringify(newTasks.map(t => t.id)));
      window.location.href = '01.4-taak-aanmaken.html';
    }

    function setLoading(on) {
      document.getElementById('loading-state').classList.toggle('hidden', !on);
      document.getElementById('import-list').classList.toggle('hidden', on);
    }

    function showError(msg) {
      const el = document.getElementById('error-state');
      el.querySelector('p').textContent = msg;
      el.classList.remove('hidden');
    }

    function addDays(dateStr, days) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }
  </script>

</body>
</html>
