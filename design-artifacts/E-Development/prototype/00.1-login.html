<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — Inloggen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-white min-h-screen flex flex-col">

  <main class="flex-1 flex flex-col justify-center px-6 py-10 max-w-sm mx-auto w-full">

    <div class="text-center mb-10">
      <div class="text-5xl mb-4">✦</div>
      <h1 class="text-2xl font-bold text-gray-900">FlowState</h1>
      <p class="text-sm text-gray-400 mt-1">Log in om door te gaan</p>
    </div>

    <form id="login-form" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">E-mailadres</label>
        <input id="email"
               type="email" autocomplete="email" required
               placeholder="naam@voorbeeld.nl"
               class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Wachtwoord</label>
        <input id="password"
               type="password" autocomplete="current-password" required
               placeholder="••••••••"
               class="w-full px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>

      <div id="error-msg"
           class="hidden text-sm text-red-500 bg-red-50 px-4 py-3 rounded-2xl"></div>

      <button type="button" id="submit-btn" onclick="handleLogin()"
              class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-2xl shadow-sm shadow-indigo-200 transition-all active:scale-98 mt-2">
        Inloggen
      </button>

    </form>

    <p class="text-center text-sm text-gray-400 mt-6">
      Nog geen account?
      <a href="00.2-registreren.html" class="text-primary font-medium hover:underline">Registreren</a>
    </p>

  </main>

  <script>
    const WORKER_URL = 'https://flowstate-proxy.flowstate-evelien.workers.dev';

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const errorEl = document.getElementById('error-msg');

      if (!email || !password) {
        showError('Vul je e-mailadres en wachtwoord in');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Bezig…';
      errorEl.classList.add('hidden');

      try {
        const r = await fetch(`${WORKER_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const body = await r.json();
        if (!r.ok) {
          showError(body.error || 'Inloggen mislukt');
          return;
        }
        localStorage.setItem('flowstate_auth_token', body.token);
        localStorage.setItem('flowstate_user_email', email);
        // If the bookmarklet sent the user here via a login-wall redirect,
        // go back to the import page where the pending params are waiting.
        const returnTo = localStorage.getItem('pending_magister_token')
          ? '01.3-import-review.html'
          : 'index.html';
        window.location.replace(returnTo);
      } catch (err) {
        showError('Geen verbinding. Probeer het opnieuw.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Inloggen';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
  </script>
</body>
</html>
