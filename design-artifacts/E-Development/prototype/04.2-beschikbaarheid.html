<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — Beschikbaarheid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=15"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-white flex items-center px-4 py-4 border-b border-gray-100 sticky top-0 z-30">
    <a href="04.1-instellingen.html" class="text-gray-500 hover:text-gray-800 text-sm font-medium flex items-center gap-1 w-16">← Terug</a>
    <span class="flex-1 text-center font-bold text-gray-900">Beschikbaarheid</span>
    <div class="w-16"></div>
  </header>

  <!-- Save toast -->
  <div id="save-toast"
       class="fixed top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
    ✓ Opgeslagen
  </div>

  <main class="flex-1 px-4 py-6 max-w-sm mx-auto w-full space-y-4">

    <!-- Recurring blocked days -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Wekelijks geblokkeerde dagen</h3>
      <p class="text-xs text-gray-400 mb-4">Tik een dag aan om hem elke week te blokkeren.</p>
      <div id="weekday-toggles" class="grid grid-cols-7 gap-1.5"></div>
    </div>

    <!-- Specific dates -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Eenmalige geblokkeerde datums</h3>
      <div class="flex items-center justify-between mb-4">
        <button onclick="prevMonth()" class="text-gray-400 hover:text-gray-700 w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100">‹</button>
        <span id="cal-month-label" class="text-sm font-semibold text-gray-800"></span>
        <button onclick="nextMonth()" class="text-gray-400 hover:text-gray-700 w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100">›</button>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-2">
        <div class="text-center text-xs text-gray-400 py-1">Ma</div>
        <div class="text-center text-xs text-gray-400 py-1">Di</div>
        <div class="text-center text-xs text-gray-400 py-1">Wo</div>
        <div class="text-center text-xs text-gray-400 py-1">Do</div>
        <div class="text-center text-xs text-gray-400 py-1">Vr</div>
        <div class="text-center text-xs text-gray-400 py-1">Za</div>
        <div class="text-center text-xs text-gray-400 py-1">Zo</div>
      </div>
      <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>

      <button onclick="clearSpecificDates()"
              class="mt-4 w-full text-xs text-gray-400 hover:text-red-500 transition-colors py-2 border border-gray-200 rounded-xl hover:border-red-200">
        Alle eenmalige datums wissen
      </button>
    </div>

  </main>

  <script>
    const DAY_NAMES = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const DAY_LABELS = ['Ma','Di','Wo','Do','Vr','Za','Zo']; // Mon-first
    const DAY_ORDER = [1,2,3,4,5,6,0]; // Mon-first indices into DAY_NAMES

    let calYear, calMonth;
    let settings = null;

    (async function() {
      const data = await FS.initData();
      settings = data.settings || {};
      if (!settings.blocked_days) settings.blocked_days = { recurring: ['saturday','sunday'], specific: [] };
      if (!settings.blocked_days.recurring) settings.blocked_days.recurring = ['saturday','sunday'];
      if (!settings.blocked_days.specific) settings.blocked_days.specific = [];

      const now = new Date();
      calYear = now.getFullYear();
      calMonth = now.getMonth();

      renderWeekdays();
      renderCalendar();
    })();

    function renderWeekdays() {
      const container = document.getElementById('weekday-toggles');
      container.innerHTML = DAY_ORDER.map((dayIdx, i) => {
        const dayName = DAY_NAMES[dayIdx];
        const blocked = settings.blocked_days.recurring.includes(dayName);
        return `<button onclick="toggleWeekday('${dayName}')" id="wd-${dayName}"
                        class="aspect-square flex items-center justify-center text-xs font-medium rounded-xl transition-all
                          ${blocked ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600 hover:bg-indigo-50'}">
                  ${DAY_LABELS[i]}
                </button>`;
      }).join('');
    }

    function toggleWeekday(dayName) {
      const idx = settings.blocked_days.recurring.indexOf(dayName);
      if (idx === -1) settings.blocked_days.recurring.push(dayName);
      else settings.blocked_days.recurring.splice(idx, 1);
      save();
      renderWeekdays();
    }

    function renderCalendar() {
      const firstDay = new Date(calYear, calMonth, 1);
      const lastDay = new Date(calYear, calMonth + 1, 0);
      const today = new Date().toISOString().slice(0,10);

      document.getElementById('cal-month-label').textContent =
        firstDay.toLocaleDateString('nl', { month: 'long', year: 'numeric' });

      let startDow = firstDay.getDay();
      startDow = startDow === 0 ? 6 : startDow - 1;

      let html = '';
      for (let i = 0; i < startDow; i++) html += '<div></div>';

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isPast = dateStr < today;
        const isToday = dateStr === today;
        const isBlocked = settings.blocked_days.specific.includes(dateStr);

        html += `<button onclick="${isPast ? '' : `toggleDate('${dateStr}')`}"
                         class="aspect-square flex items-center justify-center text-xs rounded-xl transition-all
                           ${isPast ? 'text-gray-300 cursor-default' : 'cursor-pointer'}
                           ${isToday && !isBlocked ? 'ring-2 ring-primary ring-offset-1 font-bold text-primary' : ''}
                           ${isBlocked ? 'bg-primary text-white font-medium' : (!isPast ? 'hover:bg-indigo-50 text-gray-700' : '')}">
                   ${d}
                 </button>`;
      }
      document.getElementById('cal-grid').innerHTML = html;
    }

    function toggleDate(dateStr) {
      const idx = settings.blocked_days.specific.indexOf(dateStr);
      if (idx === -1) settings.blocked_days.specific.push(dateStr);
      else settings.blocked_days.specific.splice(idx, 1);
      save();
      renderCalendar();
    }

    function clearSpecificDates() {
      if (!confirm(`Alle ${settings.blocked_days.specific.length} eenmalige datums verwijderen?`)) return;
      settings.blocked_days.specific = [];
      save();
      renderCalendar();
    }

    function prevMonth() {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    }
    function nextMonth() {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }

    function save() {
      const data = FS.loadData();
      data.settings = data.settings || {};
      data.settings.blocked_days = settings.blocked_days;
      FS.saveData(data);
      const toast = document.getElementById('save-toast');
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => { toast.classList.remove('opacity-100'); toast.classList.add('opacity-0'); }, 1500);
    }
  </script>
</body>
</html>
