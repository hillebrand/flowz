<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState — Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5' } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=7"></script>
  <script src="shared/nav.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-white flex items-center px-4 py-4 border-b border-gray-100 sticky top-0 z-30">
    <button onclick="openNav()" class="text-gray-600 hover:text-gray-900 text-xl w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-colors">☰</button>
    <span class="flex-1 text-center font-bold text-gray-900">Instellingen</span>
    <div class="w-10"></div>
  </header>

  <!-- Save toast -->
  <div id="save-toast"
       class="fixed top-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50">
    ✓ Instellingen opgeslagen
  </div>

  <main class="flex-1 px-4 py-6 max-w-sm mx-auto w-full space-y-4">

    <!-- Section: Profiel -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Profiel</h3>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Voornaam</label>
          <input id="instellingen-profiel-naam"
                 type="text" autocomplete="given-name" placeholder="Jouw naam"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">E-mailadres</label>
          <div id="instellingen-profiel-email" class="text-sm text-gray-500 px-1 py-2"></div>
        </div>
      </div>
    </div>

    <!-- Section: Studiesessies -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Studiesessies</h3>
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm text-gray-700">Sessieduur</span>
        <select id="instellingen-studeersessie-sessieduur-dropdown"
                class="text-sm border border-gray-200 rounded-xl px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60" selected>60 min</option>
          <option value="90">90 min</option>
          <option value="120">120 min</option>
        </select>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-700">Pauzetijd</span>
        <select id="instellingen-studeersessie-pauzetijd-dropdown"
                class="text-sm border border-gray-200 rounded-xl px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
          <option value="5">5 min</option>
          <option value="10" selected>10 min</option>
          <option value="15">15 min</option>
          <option value="20">20 min</option>
        </select>
      </div>
    </div>

    <!-- Section: Beschikbaarheid -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Beschikbaarheid</h3>
      <a href="04.2-beschikbaarheid.html"
         class="flex items-center justify-between group">
        <span class="text-sm text-gray-700">Geblokkeerde dagen beheren</span>
        <span class="text-gray-400 group-hover:text-primary transition-colors">›</span>
      </a>
    </div>

    <!-- Section: Herinneringen -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Herinneringen</h3>
      <div class="flex items-center justify-between mb-4">
        <span class="text-sm text-gray-700">Dagelijkse herinnering</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input id="instellingen-herinneringen-herinnering-toggle"
                 type="checkbox"
                 onchange="toggleReminderTime()"
                 class="sr-only peer">
          <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-primary/30 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
        </label>
      </div>
      <div id="reminder-time-row" class="hidden items-center justify-between">
        <span class="text-sm text-gray-700">Herinneringstijd</span>
        <input id="instellingen-herinneringen-tijdpicker"
               type="time" value="08:00"
               class="text-sm border border-gray-200 rounded-xl px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
      </div>
    </div>

    <!-- Save button -->
    <button id="instellingen-acties-opslaan-knop"
            onclick="saveSettings()"
            class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-2xl shadow-sm shadow-indigo-200 transition-all active:scale-98">
      Instellingen opslaan
    </button>

    <!-- Section: Account -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Account</h3>
      <button onclick="logout()"
              class="text-sm text-red-500 hover:text-red-600 transition-colors">
        Uitloggen
      </button>
    </div>

  </main>

  <script>
    injectNav('settings');

    (async function() {
      const data = await FS.initData();
      const s = data.settings;

      // Profiel
      document.getElementById('instellingen-profiel-naam').value = s.name || '';
      document.getElementById('instellingen-profiel-email').textContent =
        s.email || localStorage.getItem('flowstate_user_email') || '';

      // Sessieduur
      document.getElementById('instellingen-studeersessie-sessieduur-dropdown').value =
        String(s.session_length_min || 60);

      // Pauzetijd
      document.getElementById('instellingen-studeersessie-pauzetijd-dropdown').value =
        String(s.break_length_min || 10);

      // Herinneringen
      const toggle = document.getElementById('instellingen-herinneringen-herinnering-toggle');
      toggle.checked = !!s.reminder_enabled;
      if (s.reminder_enabled) {
        document.getElementById('reminder-time-row').classList.remove('hidden');
        document.getElementById('reminder-time-row').classList.add('flex');
      }
      if (s.reminder_time) {
        document.getElementById('instellingen-herinneringen-tijdpicker').value = s.reminder_time;
      }
    })();

    function toggleReminderTime() {
      const toggle = document.getElementById('instellingen-herinneringen-herinnering-toggle');
      const row = document.getElementById('reminder-time-row');
      if (toggle.checked) {
        row.classList.remove('hidden');
        row.classList.add('flex');
      } else {
        row.classList.add('hidden');
        row.classList.remove('flex');
      }
    }

    async function saveSettings() {
      const data = FS.loadData();
      data.settings.name = document.getElementById('instellingen-profiel-naam').value.trim();
      data.settings.session_length_min = parseInt(document.getElementById('instellingen-studeersessie-sessieduur-dropdown').value);
      data.settings.break_length_min = parseInt(document.getElementById('instellingen-studeersessie-pauzetijd-dropdown').value);
      data.settings.reminder_enabled = document.getElementById('instellingen-herinneringen-herinnering-toggle').checked;
      data.settings.reminder_time = document.getElementById('instellingen-herinneringen-tijdpicker').value;
      data._updated_at = Date.now();
      localStorage.setItem('flowstate_data', JSON.stringify(data));
      // await the cloud push so data is safely stored before the toast disappears
      await FS.pushCloudData(data);

      const toast = document.getElementById('save-toast');
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    function logout() {
      FS.clearAuthToken();
      localStorage.removeItem('flowstate_data');
      localStorage.removeItem('flowstate_setup_done');
      localStorage.removeItem('flowstate_energy_today');
      localStorage.removeItem('flowstate_user_email');
      window.location.replace('00.1-login.html');
    }
  </script>
</body>
</html>
