<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowz — Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', 'primary-dark': '#4f46e5', 'flowz-purple': '#2C0094', 'flowz-nav': '#C6C9FF' }, fontFamily: { karla: ['Karla', 'sans-serif'] } } } }</script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="shared/app.js?v=21"></script>
  <script src="shared/nav.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-karla">

  <header class="bg-white border-b border-gray-100 flex items-center px-4 py-3 sticky top-0 z-30">
    <button onclick="openNav()" class="text-gray-700 hover:opacity-70 w-10 h-10 flex items-center justify-center rounded-xl hover:bg-gray-100 transition-opacity"><svg viewBox="0 0 30 22" fill="none" class="w-6 h-5"><rect y="0" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="9.1" width="30" height="2.6" rx="1.3" fill="currentColor"/><rect y="18.4" width="30" height="2.6" rx="1.3" fill="currentColor"/></svg></button>
    <span class="flex-1 text-center font-bold text-gray-800">Mijn voortgang</span>
    <div class="w-10"></div>
  </header>

  <main class="flex-1 px-4 py-6 max-w-sm mx-auto w-full">

    <!-- Section: Weekoverzicht -->
    <div class="bg-white rounded-2xl px-5 py-5 shadow-sm border border-gray-100 mb-5">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-4">Deze week</h3>
      <div id="voortgangsinzicht-weekoverzicht-dag-checkmarks" class="flex justify-between items-end gap-1"></div>
    </div>

  </main>

  <script>
    injectNav('progress');

    (async function() {
      const data = await FS.initData();

      // ── Week overview ────────────────────────────────────────────────────────
      const todayStr     = FS.getDayKey();
      const days         = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
      const completedSet = new Set(data.completed_days || []);
      const sessionsLog  = data.sessions_log || [];
      const dailyPlans   = data.daily_plans  || {};

      // Read active plan for today from localStorage to recover original task list
      const todayPlan = (() => {
        try { const p = JSON.parse(localStorage.getItem('fs_daily_plan') || 'null'); return p?.date === todayStr ? p : null; } catch { return null; }
      })();

      function isDayBlocked(ds) {
        return FS.getCapacityForDate(data.settings || {}, new Date(ds + 'T12:00:00')) === 0;
      }

      const now = new Date();
      const monday = new Date(now);
      monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));

      const weekData = days.map((label, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const ds      = FS.getDayKey(d);
        const doneIds = new Set(sessionsLog.filter(s => s.date === ds).map(s => s.task_id));
        const done    = doneIds.size;

        let planned;
        if (ds === todayStr && todayPlan) {
          // Union of current plan IDs + already-done IDs recovers original plan even if
          // buildDailyPlan was called after some tasks were already marked done.
          planned = new Set([...(todayPlan.requiredIds || []), ...doneIds]).size;
        } else {
          planned = dailyPlans[ds] ?? (ds < todayStr ? done : 0);
        }

        return { label, ds, done, planned,
                 isToday: ds === todayStr, isFuture: ds > todayStr,
                 isBlocked: isDayBlocked(ds) };
      });

      const BAR_MAX  = 72;
      const BAR_MIN  = 14;
      const maxTasks = Math.max(1, ...weekData.map(d => d.planned));

      const weekHtml = weekData.map(({ label, ds, done, planned, isToday, isFuture, isBlocked }) => {
        const barH   = planned === 0
          ? BAR_MIN
          : Math.round(BAR_MIN + (BAR_MAX - BAR_MIN) * planned / maxTasks);
        const fillPct = planned === 0 ? 0 : Math.round(Math.min(1, done / planned) * 100);
        const allDone = completedSet.has(ds);
        const fillColor = allDone ? 'bg-primary' : 'bg-primary/60';
        const dimmed    = (isFuture || isBlocked) ? 'opacity-40' : '';
        const dot       = isToday
          ? '<div class="w-1.5 h-1.5 rounded-full bg-primary mt-0.5"></div>'
          : '<div class="w-1.5 h-1.5 mt-0.5"></div>';
        return `
          <div class="flex flex-col items-center gap-1">
            <div class="text-[11px] leading-none ${isToday ? 'font-bold text-primary' : 'text-gray-400'}">${label}</div>
            <div class="relative w-7 rounded-md overflow-hidden bg-gray-100 ${dimmed}" style="height:${barH}px">
              <div class="absolute bottom-0 left-0 right-0 ${fillColor} transition-all duration-500"
                   style="height:${fillPct}%"></div>
            </div>
            ${dot}
          </div>`;
      }).join('');
      document.getElementById('voortgangsinzicht-weekoverzicht-dag-checkmarks').innerHTML = weekHtml;

})();
  </script>
</body>
</html>
